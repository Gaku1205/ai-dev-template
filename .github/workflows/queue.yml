# 順番待ち（ai:queue）：進行中・停止中の物が無くなったら、番号の小さいIssueから実装を始める。
# きっかけ：ai:queue を付けた／Issueが閉じた（PRがマージされた）／ai:stuck を外した
# pull_request_target なので、PRの中身ではなく main にある版のスクリプトが動く（PRの変更でトークンを使われない）。
name: Queue

on:
  issues:
    types: [labeled, unlabeled, closed]
  pull_request_target:
    types: [closed, unlabeled]

concurrency:
  group: queue
  cancel-in-progress: false

jobs:
  next:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'ai:queue') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'ai:stuck') ||
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      # パイプラインの鍵：GitHub App があれば、その1時間だけの鍵を使う（回数制限がオーナーと別・期限切れなし）。無ければ PIPELINE_TOKEN
      - name: パイプラインの鍵を作る
        id: app-token
        if: vars.PIPELINE_APP_ID != ''
        # 鍵が作れなくても（秘密鍵の貼り間違いなど）止めずに PIPELINE_TOKEN で続ける。Doctor が ❌ で知らせる
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
      - name: パイプラインの鍵があるか
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::パイプラインの鍵がありません（GitHub App の PIPELINE_APP_ID・PIPELINE_APP_PRIVATE_KEY か、Secret PIPELINE_TOKEN を登録）"
            exit 1
          fi
      - name: トークンでIssueを読めるか
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN }}
        run: gh issue list -R "$GITHUB_REPOSITORY" --limit 1 --json number > /dev/null
      - name: 順番待ちを1つ進める
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN }}
        run: |
          # Issueが閉じた直後は、まだ一覧に反映されていないことがあるので少し待つ
          sleep 5
          .github/scripts/queue-next.sh
