name: Claude Try

# 公開のあと、AIが利用者として本番のサイトを使ってみて、壊れている・迷う・崩れている所を Issue にする（1日1回まで・1回に最大3件）
# docs/pipeline.md「使ってみる役・監査役」。動かすかは found-gate.sh、Issue にするのは found-report.sh
on:
  schedule:
    # 毎日 21:13（日本時間）。公開（main の変更）があった日だけ動く
    - cron: "13 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "条件を見ずに今すぐ動かす（公開が無くても動かす）"
        type: boolean
        default: true

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: try-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      ran: ${{ steps.claude.outcome != '' && steps.claude.outcome != 'skipped' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 今日動かすか決める
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: bash .github/scripts/found-gate.sh try
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      # 日本語のフォントの .deb をキャッシュから戻す（Ubuntu のミラーに行かずに入れる。#255 の2つ目）。戻すのも残すのもAIが動く前
      - name: 日本語のフォントのキャッシュを戻す
        id: ja-fonts-cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ja-fonts-apt
          key: ja-fonts-apt-${{ runner.os }}-v1
      - name: 撮影の準備
        id: shot-prep
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null 2>&1 || true
          JA_FONTS_CACHE="$HOME/.cache/ja-fonts-apt" .github/scripts/install-ja-fonts.sh
          mkdir -p .try
      - name: 日本語のフォントのキャッシュを残す
        if: steps.shot-prep.outputs.ja_fonts_deb == 'true' && steps.ja-fonts-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ja-fonts-apt
          key: ja-fonts-apt-${{ runner.os }}-v1
      # もう報告してある問題（開いている ai:found と、最近閉じた物）の題名をAIに渡す。AIは同じ問題にも毎回ちがう題名を付けるので、
      # 題名の重複（found-report.sh）だけでは、同じ Issue が何度も作られる
      - name: もう報告してある問題の一覧を作る
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .try
          if [ -f .github/scripts/found-known.sh ]; then bash .github/scripts/found-known.sh .try/known.md; fi
      - name: 手順書とスクリプトを読み取り専用にする
        if: steps.gate.outputs.run == 'true'
        run: chmod -R a-w .github .claude CLAUDE.md AGENTS.md 2> /dev/null || true
      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        with:
          # 定期実行のきっかけの人は、最後にワークフローを書き換えた人（配布のボット）になるので、ボットも許す（定期実行と手動しか、きっかけが無い）
          allowed_bots: "*"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            このリポジトリ（${{ github.repository }}）のサービスは ${{ steps.gate.outputs.url }} で公開しています。あなたは、このサービスを初めて使う利用者です。説明を受けず、一人で、主な使い方を一通り試してください。
            - まず `docs/spec.md` の最初の方（サービスの説明と、主な画面・操作の節）を Read で読み、利用者がやりたいことを3つまで決める。全部は読まない
            - 本番のサイトを本物のブラウザで開く：`node .github/scripts/shot.mjs --out .try --widths 390,1440 <URL>`。押す・入力する・戻るは、`.try/steps.json` に場面を書いて `node .github/scripts/shot.mjs --out .try --widths 390,1440 --steps .try/steps.json`（書き方は `.github/scripts/shot.mjs` の先頭のコメント）。撮った画像は全部 Read で見る。表示されたページのエラーも見る
            - 探すのは次の3つだけ：壊れている（エラー・押しても何も起きない・真っ白・データが消える）／迷う（次に何をすればいいか分からない・文言が分からない・戻れない）／崩れている（はみ出し・重なり・読めない文字・スマホで押せない小ささ）。好みの問題（色や雰囲気）は書かない
            - ログインが要るサービスでは、ログインの手前の画面（入口・ログイン画面）だけを試す。ログインできないこと自体は問題として書かない
            - `.try/known.md` があれば Read で読む。そこにある問題（対応中・最近閉じた物）は、もう報告してある。言い方が違っても同じ物なら書かない
            - 見つけた中から、利用者が困る順に最大3件。無ければ0件でよい（無理に探さない）
            - 最後に必ず `.try/result.json` を Write で書く：`{"findings":[{"title":"短い題名（何がどうなる）","body":"どこで（URL・画面・幅）／やった手順／期待したこと／実際に起きたこと／その場面の画像のファイル名（.try/ の中）"}]}`。日本語で書く。0件なら `{"findings":[]}`
            - `.try/` の外のファイルは変えない。使える道具は Read・Write・Glob・Grep と `node .github/scripts/shot.mjs ...` だけ（ほかのコマンドは断られる）
            - 質問して止まらない。オーナーはこの場にいない
          claude_args: '--model sonnet --max-turns 60 --allowedTools "Read,Write,Glob,Grep,Bash(node .github/scripts/shot.mjs:*)"'
      # 結果のファイルが無いまま終わったら（AIの使用が混み合って止まった 529 など）、1回だけやり直す。黙って「問題なし」にしない
      - uses: anthropics/claude-code-action@v1
        id: claude_retry
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' && hashFiles('.try/result.json') == '' }}
        continue-on-error: true
        with:
          # 定期実行のきっかけの人は、最後にワークフローを書き換えた人（配布のボット）になるので、ボットも許す（定期実行と手動しか、きっかけが無い）
          allowed_bots: "*"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            （2回目です。前回は `.try/result.json` が書かれずに終わりました（AIの使用が混み合って止まった、など）。最初からやり直し、最後に必ず書く）
            このリポジトリ（${{ github.repository }}）のサービスは ${{ steps.gate.outputs.url }} で公開しています。あなたは、このサービスを初めて使う利用者です。説明を受けず、一人で、主な使い方を一通り試してください。
            - まず `docs/spec.md` の最初の方（サービスの説明と、主な画面・操作の節）を Read で読み、利用者がやりたいことを3つまで決める。全部は読まない
            - 本番のサイトを本物のブラウザで開く：`node .github/scripts/shot.mjs --out .try --widths 390,1440 <URL>`。押す・入力する・戻るは、`.try/steps.json` に場面を書いて `node .github/scripts/shot.mjs --out .try --widths 390,1440 --steps .try/steps.json`（書き方は `.github/scripts/shot.mjs` の先頭のコメント）。撮った画像は全部 Read で見る。表示されたページのエラーも見る
            - 探すのは次の3つだけ：壊れている（エラー・押しても何も起きない・真っ白・データが消える）／迷う（次に何をすればいいか分からない・文言が分からない・戻れない）／崩れている（はみ出し・重なり・読めない文字・スマホで押せない小ささ）。好みの問題（色や雰囲気）は書かない
            - ログインが要るサービスでは、ログインの手前の画面（入口・ログイン画面）だけを試す。ログインできないこと自体は問題として書かない
            - `.try/known.md` があれば Read で読む。そこにある問題（対応中・最近閉じた物）は、もう報告してある。言い方が違っても同じ物なら書かない
            - 見つけた中から、利用者が困る順に最大3件。無ければ0件でよい（無理に探さない）
            - 最後に必ず `.try/result.json` を Write で書く：`{"findings":[{"title":"短い題名（何がどうなる）","body":"どこで（URL・画面・幅）／やった手順／期待したこと／実際に起きたこと／その場面の画像のファイル名（.try/ の中）"}]}`。日本語で書く。0件なら `{"findings":[]}`
            - `.try/` の外のファイルは変えない。使える道具は Read・Write・Glob・Grep と `node .github/scripts/shot.mjs ...` だけ（ほかのコマンドは断られる）
            - 質問して止まらない。オーナーはこの場にいない
          claude_args: '--model sonnet --max-turns 60 --allowedTools "Read,Write,Glob,Grep,Bash(node .github/scripts/shot.mjs:*)"'
      - name: AIの結果を残す
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        env:
          EXECUTION_FILE: ${{ steps.claude_retry.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: bash .github/scripts/ai-report.sh --title "Claude Try" "$EXECUTION_FILE" || true
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        with:
          name: try-out
          path: .try/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # 見つけた問題を Issue にする。AIが動いたジョブとは分け、パイプラインの鍵はこちらだけが持つ（AIのジョブに鍵を渡さない）。
  # スクリプトは main の版（AIは .try/ の結果だけを渡す）
  report:
    needs: work
    if: ${{ !cancelled() && needs.work.outputs.ran == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # 秘密鍵を PKCS#8 にそろえる（create-github-app-token は Node 24 だと「BEGIN RSA PRIVATE KEY」の形式を読めず Invalid keyData になる）
      - name: パイプラインの鍵の秘密鍵をそろえる
        id: app-key
        if: vars.PIPELINE_APP_ID != ''
        continue-on-error: true
        env:
          KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
        run: |
          # 貼るときに改行が消えて1行になっていても、頭と終わりの行と中身から組み立て直す
          k=$(printf '%s' "$KEY" | tr -d '\r'); k=${k//\\n/$'\n'}
          type=$(printf '%s' "$k" | grep -oE 'BEGIN [A-Z ]*PRIVATE KEY' | head -1 | sed 's/^BEGIN //')
          # 頭と終わりの行が抜けていたら、GitHub App の鍵の形式（RSA）とみなす
          [ -n "$type" ] || type="RSA PRIVATE KEY"
          body=$(printf '%s' "$k" | sed -e 's/-----BEGIN [A-Z ]*PRIVATE KEY-----//' -e 's/-----END [A-Z ]*PRIVATE KEY-----//' | tr -d ' \n\t"')
          pem=$(printf -- '-----BEGIN %s-----\n%s\n-----END %s-----\n' "$type" "$(printf '%s' "$body" | fold -w 64)" "$type" | openssl pkey 2> /dev/null) \
            || { b=no; e=no; case "$k" in *"-----BEGIN"*) b=yes;; esac; case "$k" in *"-----END"*) e=yes;; esac
                 echo "::error::PIPELINE_APP_PRIVATE_KEY を秘密鍵として読めません（.pem の中身を -----BEGIN から -----END まで全部貼る）。手がかり：全体 ${#KEY} 文字・$(printf '%s\n' "$KEY" | wc -l) 行・BEGIN の行 $b・END の行 $e・中身 ${#body} 文字（2048ビットの鍵なら中身は約1,600文字）"; exit 1; }
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo 'pem<<PEM_END'; echo "$pem"; echo 'PEM_END'; } >> "$GITHUB_OUTPUT"
      # パイプラインの鍵：GitHub App があれば、その1時間だけの鍵を使う（回数制限がオーナーと別・期限切れなし）。無ければ PIPELINE_TOKEN
      - name: パイプラインの鍵を作る
        id: app-token
        if: steps.app-key.outputs.pem != ''
        # 鍵が作れなくても（秘密鍵の貼り間違いなど）止めずに PIPELINE_TOKEN で続ける。Doctor が ❌ で知らせる
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ steps.app-key.outputs.pem }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: try-out
          path: .try
      - name: 見つけた問題を Issue にする
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/found-report.sh try .try/result.json
