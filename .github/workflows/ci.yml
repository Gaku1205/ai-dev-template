# 品質ゲート：PRごとに確認（pipeline.json の checks。無ければ型チェック・リント・テスト・ビルド）を回す。
# 合否はAIではなく、ここで決める。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 言語の実行環境と依存を入れる（pipeline.json に合わせる。無ければ今までの Node 22・npm ci）
      - name: 実行環境をそろえる
        id: stack
        uses: ./.github/actions/setup-stack
      # pipeline.json の checks を順に全部回す（無ければ型チェック・リント・テスト（あれば）・ビルド）
      - name: 確認
        run: .github/scripts/run-checks.sh
      # 依存の脆弱性（npm audit。本番で使う物だけ・重い物から）。テンプレート本体では落とす（工場が作る新しいサービスに危ない版を入れない。#141）。
      # 配り先のアプリでは警告だけ（今ある依存で全アプリのCIを一斉に止めないため。上げるのは各アプリの Issue で）
      - name: 依存の脆弱性
        if: hashFiles('package-lock.json') != ''
        env:
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
        run: |
          if npm audit --omit=dev --audit-level=high; then exit 0; fi
          if [ "$IS_TEMPLATE" = true ]; then
            echo "::error::重い脆弱性のある依存があります（npm audit）。package.json の版を上げてください"
            exit 1
          fi
          echo "::warning::重い脆弱性のある依存があります（npm audit）。このアプリの package.json の版を上げる Issue を作ってください"
      # 見た目のテスト：画面のスクショを、前の画像と比べる（Node のアプリで、package.json に test:visual があるときだけ）
      - name: 見た目のテストがあるか
        id: visual
        run: |
          enabled=false
          if [ -n "${{ steps.stack.outputs.node }}" ] && [ -f package.json ]; then
            enabled=$(jq -r '.scripts["test:visual"] != null' package.json)
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      # ブラウザは actions/cache に置き、apt（Ubuntu のミラー）はライブラリかフォントが足りないときだけ使う（外の障害で落ちにくくする。#255）
      - name: 見た目のテスト用のブラウザのキャッシュ
        if: steps.visual.outputs.enabled == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 見た目のテスト用のブラウザを入れる
        if: steps.visual.outputs.enabled == 'true'
        run: |
          npx playwright install chromium
          # --with-deps は、ライブラリのほかに日本語などのフォントも入れる（基準の画像はそのフォントで撮ってある）。両方そろっている時だけ apt を飛ばす
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" > /dev/null 2>&1 \
            && dpkg -s fonts-ipafont-gothic fonts-wqy-zenhei fonts-noto-color-emoji > /dev/null 2>&1; then
            echo "ライブラリとフォントはそろっているので、apt は使いません"
          else
            npx playwright install --with-deps chromium
          fi
      - name: 見た目のテスト
        if: steps.visual.outputs.enabled == 'true'
        run: npm run test:visual
      - name: 見た目のテストの結果（差分の画像）を残す
        if: failure() && steps.visual.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7

  # パイプラインのシェルスクリプトの静的チェック（書き間違いを先に見つける）
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -S warning -x -P SCRIPTDIR .github/scripts/*.sh .github/scripts/tests/*.sh
      # ワークフローの式の書き間違い（GitHub の式に無い + など）は、YAML としては正しいので、動くまで気づけない。
      # 工場（factory.yml）が #147 から全部のリポジトリで動かなくなっていた。actionlint で、マージの前に見つける。
      # アクションの入力の名前の確かめ（actionlint の知っている版が古いことがある）と、run の中の shellcheck は外す（上でやる）
      - name: ワークフローの確認（actionlint）
        run: |
          pip install --quiet --disable-pip-version-check actionlint-py==1.7.12.25 || { echo "::warning::actionlint を入れられなかったので、ワークフローの確認を飛ばします"; exit 0; }
          actionlint -shellcheck= -ignore 'is not defined in action' .github/workflows/*.yml

  # パイプラインのスクリプトのテスト（疑似 gh。本物のGitHubには触らない）
  script-tests:
    runs-on: ubuntu-latest
    # テストが増えて10分ぎりぎりになり、時間切れで取り消された（PR #161）。並列化（run-all.sh）と合わせて余裕を持たせる
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: スクリプトのテスト
        run: .github/scripts/tests/run-all.sh

  # 配り先の形でテストを動かす（テンプレート本体だけ）。テストは .github/ ごと全部のアプリに配られ、アプリの CI でも動く。
  # テンプレートにしか無い物（examples/ など）に頼るテストが混ざると、配ったとたんに全部のアプリの CI が落ちるので、配る前にここで見つける
  # 配り先の形でテストを回す。見本（app-fixtures/）ごとに別のジョブで並べる（全部を1つのジョブで回すと、テスト全体×見本の数で15分を超えた。#146）。
  # canary は、変数 SYNC_CANARY の実物のアプリ（公開リポジトリ）だけを回す
  script-tests-as-app:
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [next-vercel, webgame, electron, python, visual-keep, canary]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配り先の形でテストを動かす（${{ matrix.app }}）
        env:
          APP: ${{ matrix.app }}
          SYNC_CANARY: ${{ matrix.app == 'canary' && vars.SYNC_CANARY || '' }}
        run: |
          s=.github/scripts/tests/run-as-app.sh
          if [ ! -f "$s" ]; then echo "run-as-app.sh がまだ無いので、飛ばします"; exit 0; fi
          if [ "$APP" = canary ]; then
            [ -n "$SYNC_CANARY" ] || { echo "変数 SYNC_CANARY が無いので、実物のアプリでは回しません"; exit 0; }
            bash "$s" --canary-only
          elif [ -d ".github/scripts/tests/app-fixtures/$APP" ]; then
            bash "$s" "$APP"
          else
            echo "見本 $APP がまだ無いので、飛ばします"
          fi
