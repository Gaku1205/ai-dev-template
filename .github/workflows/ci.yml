# 品質ゲート：PRごとに型チェック・リント・ビルドを回す。
# 合否はAIではなく、ここで決める。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: リント
        run: npm run lint
      - name: テスト
        run: npm run test
      - name: ビルド
        run: npm run build
