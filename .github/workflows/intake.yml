# 受付：新しいIssueにラベルが無ければ、自動で企画AI（ai:plan）に回す（完全自動のため）。
# 動かしたくないIssueには、作るときに ai:skip を付ける（外すと、見張り役が拾って企画に回す）。
name: Intake

on:
  issues:
    types: [opened]

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: .github/scripts/intake.sh
