# 画面案：見た目の大きい作り直し・新しい画面の Issue は、作る前にざっくり画面を2案作って、オーナーに選んでもらう（企画AIが MOCKS と決めると ai:mocks が付く）。
# AIは今の画面とデザイン仕様を見て、設計メモ（題材の持ち物・考え・通し表）を書き、1枚の HTML を2案（PC とスマホ）作る。別のAI（審査役）が画像だけで審査し、届かなければ1回直す。画像は ai-mocks ブランチに置き、Issue に選択肢と質問を書いて ai:question で待つ。
# 画面案が書かれなかったら、その場で1回だけやり直し、それでも無ければ止まらずに案なしで企画へ進む（mocks-publish.sh）。
# オーナーが答えると answer.yml が企画に戻し、企画AIが選んだ画面を「目標の画面」として Issue に書く（実装AIはそれに合わせて作る）
name: Claude Mocks

on:
  issues:
    types: [labeled]

jobs:
  work:
    if: github.event.label.name == 'ai:mocks' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    # 作る ＋ 審査 ＋ 直し ＋ もう一度審査、まで入る長さ
    timeout-minutes: 100
    concurrency:
      group: mocks-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      started: ${{ steps.started.outputs.at }}
      outcome: ${{ steps.claude_retry.outcome != 'skipped' && steps.claude_retry.outcome || steps.claude.outcome }}
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      - name: 始めた時刻（進捗ログ用）
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # 日本語のフォントの .deb をキャッシュから戻す（Ubuntu のミラーに行かずに入れる。#255 の2つ目）。戻すのも残すのもAIが動く前
      - name: 日本語のフォントのキャッシュを戻す
        id: ja-fonts-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ja-fonts-apt
          key: ja-fonts-apt-${{ runner.os }}-v1
      - name: 撮影の準備
        id: shot-prep
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null 2>&1 || true
          JA_FONTS_CACHE="$HOME/.cache/ja-fonts-apt" .github/scripts/install-ja-fonts.sh
          mkdir -p mocks
      - name: 日本語のフォントのキャッシュを残す
        if: steps.shot-prep.outputs.ja_fonts_deb == 'true' && steps.ja-fonts-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ja-fonts-apt
          key: ja-fonts-apt-${{ runner.os }}-v1
      # 今の画面を撮っておく（AIが今の見た目を見て、そこからの作り直しを考えるため。撮れなくても続ける）
      - name: 今の画面を撮る
        continue-on-error: true
        run: |
          if [ -f package.json ] && [ "$(jq -r '.scripts.start != null' package.json)" = true ]; then
            npm ci --no-audit --no-fund && npm run build && node .github/scripts/shot.mjs --serve --out mocks/now --widths 1440,390 /
          fi
      # 他人のコメントを AI に渡さない（#152・#196）：信頼できる書き手の物だけを mocks/issue.txt にする。
      # スクリプトは main の版を API で取って動かす（PR のコードは動かさない）。読めなかったら、その旨だけを書いて続ける（黙って全部は渡さない）
      - name: 信頼できる人のコメントだけを集める
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_APP_ID: ${{ vars.PIPELINE_APP_ID }}
          NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/.github/scripts/trusted-comments.sh?ref=$DEFAULT_BRANCH" > "$RUNNER_TEMP/trusted-comments.sh"
          if ! bash "$RUNNER_TEMP/trusted-comments.sh" "$NUMBER" > "$RUNNER_TEMP/thread.md"; then
            echo "（#$NUMBER のコメントを読めなかった。本文だけを gh で読む。--comments は付けない）" > "$RUNNER_TEMP/thread.md"
          fi
          cp "$RUNNER_TEMP/thread.md" mocks/issue.txt
          if [ -d .git ]; then echo "mocks/issue.txt" >> .git/info/exclude; fi
      # 起こしたボット（パイプラインの App や、工場の相談の github-actions）を、AIのアクションが断らないようにする。
      # AI自身（claude[bot]）は許さない。Secret は使わない
      - name: 起こしたボットを許可に入れる
        id: bots
        env:
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          list=""
          if [ "$SENDER_TYPE" = Bot ] && [ "$SENDER" != "claude[bot]" ]; then
            list="${SENDER},${SENDER%\[bot\]}"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: 手順書とスクリプトを読み取り専用にする
        run: chmod -R a-w .github .claude CLAUDE.md AGENTS.md 2> /dev/null || true
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: claude
        continue-on-error: true
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            このリポジトリ（${{ github.repository }}）の Issue #${{ github.event.issue.number }} は、見た目の大きい作り直しか新しい画面です。作る前に、オーナーに選んでもらうざっくり画面を2案作ってください。
            - 手順は `.github/factory/mocks.md`。最初に Read で読み、そのとおりに作る（置き場は `mocks/` だけ。最後に必ず `mocks/mocks.json` を書く）
            - Issue とコメントは `mocks/issue.txt`。今の画面は `mocks/now/`（あれば）
            - `.github/factory/design-department.md` の「AIっぽさの型（使わない）」を守る
            - 最初に設計メモ（`mocks/concept.md`。`.github/factory/concept.md` のとおり）を書く。作った画面は、別のAI（審査役）が画像だけを見て審査する
            - 使える道具は Read・Write・Edit・Glob・Grep・WebSearch・WebFetch と、手順書に書いたコマンド（撮る `node .github/scripts/shot.mjs ...`、taste-skill の draw.mjs・assets.mjs・lint.mjs・inspect.mjs）だけ。ほかのコマンド（ls・cat・mkdir など）は断られるので使わない
            - 質問して止まらない。オーナーはこの場にいない。迷ったら、考えがはっきり出る側（大きく・濃く・本物の素材を広く）で作り、迷った所は `mocks.json` の `questions` に入れる
          claude_args: '--model opus --max-turns 150 --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node .github/scripts/shot.mjs:*),Bash(node .claude/skills/taste-skill/scripts/draw.mjs:*),Bash(node .claude/skills/taste-skill/scripts/lint.mjs:*),Bash(node .claude/skills/taste-skill/scripts/inspect.mjs:*),Bash(node .claude/skills/taste-skill/scripts/assets.mjs:*)"'
      # 何が起きたかを、ログと Summary に残す（拒否された操作と、AIが最後に言ったこと）。
      # 画面案（mocks/mocks.json）が無ければ、拒否された操作を手がかりに付けて、この場で1回だけやり直す
      - name: 結果を残して、やり直すか決める
        id: retry
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          bash .github/scripts/ai-report.sh --title "画面案（1回目）" "$EXECUTION_FILE" || true
          redo=false
          if [ ! -f mocks/mocks.json ]; then redo=true; fi
          # やり直すAIへの手がかり（1行。拒否された操作の名前だけ）
          hint=$(bash .github/scripts/denials.sh --comment "$EXECUTION_FILE" 2> /dev/null | tr '\n' ' ' | cut -c1-300 || true)
          echo "画面案がある：$([ -f mocks/mocks.json ] && echo yes || echo no)・やり直す：$redo"
          echo "redo=$redo" >> "$GITHUB_OUTPUT"
          echo "hint=${hint//$'\n'/ }" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: claude_retry
        if: ${{ !cancelled() && steps.retry.outputs.redo == 'true' }}
        continue-on-error: true
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            このリポジトリ（${{ github.repository }}）の Issue #${{ github.event.issue.number }} は、見た目の大きい作り直しか新しい画面です。作る前に、オーナーに選んでもらうざっくり画面を2案作ってください。
            - 手順は `.github/factory/mocks.md`。最初に Read で読み、そのとおりに作る（置き場は `mocks/` だけ。最後に必ず `mocks/mocks.json` を書く）
            - Issue とコメントは `mocks/issue.txt`。今の画面は `mocks/now/`（あれば）
            - `.github/factory/design-department.md` の「AIっぽさの型（使わない）」を守る
            - 最初に設計メモ（`mocks/concept.md`。`.github/factory/concept.md` のとおり）を書く。作った画面は、別のAI（審査役）が画像だけを見て審査する
            - 使える道具は Read・Write・Edit・Glob・Grep・WebSearch・WebFetch と、手順書に書いたコマンド（撮る `node .github/scripts/shot.mjs ...`、taste-skill の draw.mjs・assets.mjs・lint.mjs・inspect.mjs）だけ。ほかのコマンド（ls・cat・mkdir など）は断られるので使わない
            - 質問して止まらない。オーナーはこの場にいない。迷ったら、考えがはっきり出る側（大きく・濃く・本物の素材を広く）で作り、迷った所は `mocks.json` の `questions` に入れる
            - これは2回目です。前回は `mocks/mocks.json` が書かれずに終わりました。${{ steps.retry.outputs.hint }}（断られた操作は使わない）。`mocks/` に書きかけのファイルがあれば、それを使って仕上げる
          claude_args: '--model opus --max-turns 150 --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node .github/scripts/shot.mjs:*),Bash(node .claude/skills/taste-skill/scripts/draw.mjs:*),Bash(node .claude/skills/taste-skill/scripts/lint.mjs:*),Bash(node .claude/skills/taste-skill/scripts/inspect.mjs:*),Bash(node .claude/skills/taste-skill/scripts/assets.mjs:*)"'
      - name: やり直しの結果も残す
        if: ${{ !cancelled() && steps.claude_retry.outcome != 'skipped' }}
        env:
          EXECUTION_FILE: ${{ steps.claude_retry.outputs.execution_file }}
        run: bash .github/scripts/ai-report.sh --title "画面案（やり直し）" "$EXECUTION_FILE" || true
      # ---- 関門と審査（docs/pipeline.md「デザインの仕組み」） ----
      # 作ったAIとは別のAI（審査役）が、画像だけを見て答える。合格かどうかはスクリプトが決める。届かなければ1回だけ直させ、もう一度審査する。
      # それでも届かなければ、点と残った指摘を付けてオーナーに見せる（止めない）
      - name: 関門と審査の準備（1 回目）
        id: review1
        if: ${{ !cancelled() && hashFiles('mocks/mocks.json') != '' }}
        env:
          BRIEF_FILE: mocks/issue.txt
        run: .github/scripts/design-review.sh prepare mocks
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: judge1
        if: ${{ !cancelled() && steps.review1.outputs.ok == 'true' }}
        continue-on-error: true
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは審査役です（作ったAIとは別のAI）。`.github/factory/judge.md` を全部読み、そのとおりに、画像だけを見て審査してください。
            - 種類：screen（この種類の問いに全部答える）
            - 審査する物（`items` の `name`）：${{ steps.review1.outputs.items }}。画像は `.judge/made/` にある（名前の頭が物の名前。`-s2`・`-s3` は下へスクロールした続き）
            - 比べる実在の画面は `.judge/refs/`、Issue（オーナーの注文）と作った側の設計メモは `.judge/brief.md`
            - 書くのは `.judge/verdict.json` だけ。コード・HTML は開かない
          claude_args: '--model opus --max-turns 40 --allowedTools "Read,Glob,Write"'
      - name: 審査の結果（1 回目）
        id: verdict1
        if: ${{ !cancelled() && steps.review1.outputs.ok == 'true' }}
        run: .github/scripts/design-review.sh verdict screen 1
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: fix
        if: ${{ !cancelled() && steps.verdict1.outputs.pass == 'false' }}
        continue-on-error: true
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            このリポジトリ（${{ github.repository }}）の Issue #${{ github.event.issue.number }} のざっくり画面（`mocks/`）を、別のAI（審査役）と関門が審査し、合格に届きませんでした。審査の結果を直してください。
            - 手順は `.github/factory/mocks.md` の「審査の後の直し」。`.github/factory/concept.md` も読む
            - `.judge/fix.md`（直すこと）と `.judge/made/`（審査に使った画像）を Read で見て、今ある `mocks/` の物を直す（新しく作り直さない。合格している案は触らない。消すだけにせず、埋める）
            - 直したら、撮り直して全部 Read で見る。`mocks/mocks.json` は、中身が変わった所だけ直す（消さない）
            - 使える道具は Read・Write・Edit・Glob・Grep・WebSearch・WebFetch と、手順書に書いたコマンドだけ
          claude_args: '--model opus --max-turns 80 --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node .github/scripts/shot.mjs:*),Bash(node .claude/skills/taste-skill/scripts/draw.mjs:*),Bash(node .claude/skills/taste-skill/scripts/lint.mjs:*),Bash(node .claude/skills/taste-skill/scripts/inspect.mjs:*),Bash(node .claude/skills/taste-skill/scripts/assets.mjs:*)"'
      - name: 関門と審査の準備（2 回目）
        id: review2
        if: ${{ !cancelled() && steps.fix.outcome != 'skipped' }}
        env:
          BRIEF_FILE: mocks/issue.txt
        run: .github/scripts/design-review.sh prepare mocks
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: judge2
        if: ${{ !cancelled() && steps.review2.outputs.ok == 'true' }}
        continue-on-error: true
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは審査役です（作ったAIとは別のAI）。`.github/factory/judge.md` を全部読み、そのとおりに、画像だけを見て審査してください。
            - 種類：screen（この種類の問いに全部答える）
            - 審査する物（`items` の `name`）：${{ steps.review2.outputs.items }}。画像は `.judge/made/` にある（名前の頭が物の名前。`-s2`・`-s3` は下へスクロールした続き）
            - 比べる実在の画面は `.judge/refs/`、Issue（オーナーの注文）と作った側の設計メモは `.judge/brief.md`
            - 書くのは `.judge/verdict.json` だけ。コード・HTML は開かない
          claude_args: '--model opus --max-turns 40 --allowedTools "Read,Glob,Write"'
      - name: 審査の結果（2 回目）
        id: verdict2
        if: ${{ !cancelled() && steps.review2.outputs.ok == 'true' }}
        run: .github/scripts/design-review.sh verdict screen 2
      - name: 審査の結果をまとめる
        if: ${{ !cancelled() }}
        run: |
          .github/scripts/design-review.sh summary mocks/judge.md || true
          for k in a b; do
            f=".judge/made/mock-$k-1440-s2.png"
            if [ -f "$f" ] && [ ! -L "$f" ]; then cp "$f" "mocks/mock-$k-1440-s2.png"; fi
          done
      # 実行記録も渡す（publish が、拒否された操作をコメントに書くのに使う）
      - name: 実行記録を置く
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.claude_retry.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: |
          mkdir -p mocks
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then cp "$EXECUTION_FILE" mocks/claude-execution-output.json; fi
      # 審査の記録（審査役の答え・指摘の紙・関門・渡した紙）を残す。あとから「なぜ落ちたか」を調べるため
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: mocks-judge-record
          path: |
            .judge/verdict.json
            .judge/fix.md
            .judge/gate.json
            .judge/brief.md
            .judge/lint.json
            .judge-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: mocks-out
          path: |
            mocks/mocks.json
            mocks/mock-*.html
            mocks/mock-*-1440.png
            mocks/mock-*-390.png
            mocks/mock-*-1440-s2.png
            mocks/concept.md
            mocks/judge.md
            mocks/claude-execution-output.json
          retention-days: 3

  publish:
    needs: work
    if: ${{ !cancelled() && github.event.label.name == 'ai:mocks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      # 秘密鍵を PKCS#8 にそろえる（create-github-app-token は Node 24 だと「BEGIN RSA PRIVATE KEY」の形式を読めず Invalid keyData になる）
      - name: パイプラインの鍵の秘密鍵をそろえる
        id: app-key
        if: vars.PIPELINE_APP_ID != ''
        continue-on-error: true
        env:
          KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
        run: |
          # 貼るときに改行が消えて1行になっていても、頭と終わりの行と中身から組み立て直す
          k=$(printf '%s' "$KEY" | tr -d '\r'); k=${k//\\n/$'\n'}
          type=$(printf '%s' "$k" | grep -oE 'BEGIN [A-Z ]*PRIVATE KEY' | head -1 | sed 's/^BEGIN //')
          # 頭と終わりの行が抜けていたら、GitHub App の鍵の形式（RSA）とみなす
          [ -n "$type" ] || type="RSA PRIVATE KEY"
          body=$(printf '%s' "$k" | sed -e 's/-----BEGIN [A-Z ]*PRIVATE KEY-----//' -e 's/-----END [A-Z ]*PRIVATE KEY-----//' | tr -d ' \n\t"')
          pem=$(printf -- '-----BEGIN %s-----\n%s\n-----END %s-----\n' "$type" "$(printf '%s' "$body" | fold -w 64)" "$type" | openssl pkey 2> /dev/null) \
            || { b=no; e=no; case "$k" in *"-----BEGIN"*) b=yes;; esac; case "$k" in *"-----END"*) e=yes;; esac
                 echo "::error::PIPELINE_APP_PRIVATE_KEY を秘密鍵として読めません（.pem の中身を -----BEGIN から -----END まで全部貼る）。手がかり：全体 ${#KEY} 文字・$(printf '%s\n' "$KEY" | wc -l) 行・BEGIN の行 $b・END の行 $e・中身 ${#body} 文字（2048ビットの鍵なら中身は約1,600文字）"; exit 1; }
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo 'pem<<PEM_END'; echo "$pem"; echo 'PEM_END'; } >> "$GITHUB_OUTPUT"
      # パイプラインの鍵：GitHub App があれば、その1時間だけの鍵を使う（回数制限がオーナーと別・期限切れなし）。無ければ PIPELINE_TOKEN
      - name: パイプラインの鍵を作る
        id: app-token
        if: steps.app-key.outputs.pem != ''
        # 鍵が作れなくても（秘密鍵の貼り間違いなど）止めずに PIPELINE_TOKEN で続ける。Doctor が ❌ で知らせる
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ steps.app-key.outputs.pem }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.work.result == 'success'
        continue-on-error: true
        with:
          name: mocks-out
          path: out
      # MOCKS_RETRY=1：やり直しは work の中でもう済んでいる。ここでも画面案が無ければ、止まらずに案なしで企画（ai:plan）へ進む。
      # ai:plan で企画のワークフローを動かすので、パイプラインの鍵で付ける（github.token で付けたラベルは次のワークフローを動かさない。
      # そのときは見張り役が拾うまで待つ）
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN || github.token }}
          MOCKS_RETRY: "1"
          CLAUDE_EXECUTION_FILE: out/claude-execution-output.json
          ISSUE: ${{ github.event.issue.number }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
          AGENT_DESK_URL: ${{ vars.AGENT_DESK_URL }}
        run: .github/scripts/mocks-publish.sh
      - name: 進捗ログ（画面案）
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          STARTED: ${{ needs.work.outputs.started }}
          RESULT: ${{ needs.work.result == 'success' && needs.work.outputs.outcome == 'success' && 'success' || 'failure' }}
        run: bash .github/scripts/step-log.sh --issue "$ISSUE" --step mocks --model opus --result "$RESULT" ${STARTED:+--started "$STARTED"}
