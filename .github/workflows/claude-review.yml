# レビューAI：PRに「ai:review」ラベルを付けた時だけ、実装とは別のClaudeがレビューする。
# AIは指摘するだけ。マージするかはCIと人間が決める。
# 見逃しが一番高くつく所なので、モデルは軽くせず sonnet。
# もう一度レビューしてほしい時は、ラベルを外して付け直す。
name: Claude Review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'ai:review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--model sonnet --max-turns 20 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
