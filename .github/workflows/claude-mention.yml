# 差し戻し用：PRやIssueのコメントで「@claude 〜を直して」と書くとClaudeが対応する。
name: Claude Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      # 自動で直させる最後の1回（3回目）は、いちばん強いモデルで直す（依頼のコメントに印が付く）
      MODEL: "${{ contains(github.event.comment.body, 'auto-fix-model: opus') && 'opus' || 'sonnet' }}"
      MAX_TURNS: "${{ contains(github.event.comment.body, 'auto-fix-model: opus') && '60' || '40' }}"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model ${{ env.MODEL }} --max-turns ${{ env.MAX_TURNS }} --allowedTools \"Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(git fetch:*),Bash(git merge:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run test),Bash(npm run build),Bash(.github/scripts/tests/run-all.sh),Bash(bash .github/scripts/tests/run-all.sh),Bash(shellcheck:*)\" --disallowedTools \"Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git rebase:*)\""
