# 企画AI：Issueに「ai:plan」ラベルを付けると、短いメモを実装AIが作業できるIssueに清書する。
# 清書できたら ai:implement を付けて実装に回す（全自動）。意図が読み取れなければ質問して止まる。
# 進行中の作業とぶつかるかも企画AIが判断し、ぶつかるなら順番待ち（ai:queue）、別の場所なら並列で始める。
name: Claude Plan

on:
  issues:
    types: [labeled]

jobs:
  plan:
    if: github.event.label.name == 'ai:plan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-plan-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        id: claude
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはこのリポジトリ（${{ github.repository }}）の企画担当です。
            Issue #${{ github.event.issue.number }} は、オーナーがスマホで書いた短いメモです。これを、実装AIがそのまま作業できるIssueに清書してください。

            手順：
            1. `gh issue view ${{ github.event.issue.number }} --comments` でメモとコメントを読む
            2. CLAUDE.md と、あれば docs/ 以下の仕様書を読み、関係するコードを確認する
            3. タイトルと本文を書き直し、`gh issue edit ${{ github.event.issue.number }} --title "..." --body-file <ファイル>` で更新する
            4. `gh issue list --state open --label ai:implement` と `gh pr list --state open` で、いま進行中の作業を見る。
               それぞれのIssue・PRの中身（`gh issue view` / `gh pr diff`）と見比べて、このIssueと同時に作業してよいかを決める
               - 同じファイルを書き換えそう、同じ機能や画面の同じ場所を触る、前の作業の結果を使う → 待つ（WAIT）
               - 触る場所がはっきり別で、どちらが先にマージされても困らない → 並列（PARALLEL）
               - 迷ったら待つ
            5. 最後に、作業フォルダ直下のファイル `plan-result.txt` に2行だけを書く
               1行目は次のどれか
               - `READY size:S`：文言や見た目の小さい修正
               - `READY`：普通の大きさ
               - `READY size:L`：設計が絡む大きい作業
               - `QUESTION`：**人間にしかできない作業が必須のときだけ**（依存パッケージの追加、`.github/`・`docs/`・CLAUDE.md の変更、秘密情報の登録、外部サービスの契約や設定）。このときは本文を書き直さず、`gh issue comment` で、人間に何をしてほしいかを書く
               - 意図が読み取れなくても、質問で止まらない。いちばん無難な解釈で `READY` にして、本文に「### 仮定」を書く（下）
               2行目は `PARALLEL` か `WAIT`（進行中の作業が無ければ `PARALLEL`）。WAIT のときは、どの作業とぶつかるかを Issue に `gh issue comment` で1行書く。書き出しは「順番待ちの理由：」にし、「前の作業が終わると自動で始まります」で終える（実装AIへの指示にならないようにする）

            本文の形（日本語）：
            ### 背景
            （なぜやるか。オーナーのメモの意図）
            ### やること
            （箇条書き。触るファイルや関数の見当があれば書く）
            ### 受け入れ条件
            - [ ] （確かめられる条件を箇条書き）
            - [ ] 型チェック・リント・テスト・ビルドが通る
            ### やらないこと
            （紛らわしい周辺の作業）
            ### 仮定
            （メモから読み取れなくて、あなたが決めた内容を箇条書き。無ければこの見出しごと書かない。違うときはオーナーがコメントで直す）
            > 元のメモ：（オーナーのメモをそのまま）

            守ること：
            - メモの意図を変えない。メモに無い機能を足さない。1つのPRで終わる大きさにする
            - 1つのPRに収まらない大きさなら、いちばん最初に作る分（それだけで動く最小のまとまり）だけをこのIssueにして `READY`。残りは、新しいIssueとして `gh issue create --title "..." --body-file <ファイル>` で作る（本文は上の形。ラベルは付けない。自動で企画に回る）。このIssueの「やらないこと」に、新しいIssueの番号を書く
            - 仕様書と食い違うときは、背景に「docs/○○ の△△と違う」と書く
            - 見た目や挙動を新しく決める・変える作業なら、「やること」の最初に「`docs/spec.md`・`docs/design.md` に○○を書く（そのあと実装する）」を入れる。デザインが決まっていない新しい見た目は、人間に聞かずに既存のルールに合わせて決める前提で、「仮定」に書く
            - コードは変更しない。Issueの更新とコメントだけをする
          claude_args: '--model sonnet --max-turns 30 --allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh issue list:*),Bash(gh pr list:*),Bash(gh pr diff:*),Read,Glob,Grep,Write"'
      - name: 次へ進める（実装を依頼する／質問で止まる）
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          GITHUB_TOKEN_FOR_LABELS: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
          AGENT_DESK_URL: ${{ vars.AGENT_DESK_URL }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PLAN_OUTCOME: ${{ steps.claude.outcome }}
        run: .github/scripts/after-plan.sh
