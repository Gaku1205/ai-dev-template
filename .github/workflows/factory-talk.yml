# 工場の相談：「新サービス：〜」の1行から、いきなり作らず、オーナーに選んでもらいながら作る物と見た目を決める（.github/factory/talk.md）。
#   案を5つ＋質問 → 見た目の方向を3つ → ざっくり画面を2案 → 最終確認 →「作る」で Factory（factory.yml）を動かす
# 各段階で、選択肢と質問を Issue のコメントに書いて、オーナーの返事を待つ（ずっと待つ）。返事はコメントで書く（agent-desk からも書ける）。
# AIが作っている途中の返事も捨てない（同じ Issue の実行は順番待ちになり、前の選択肢への返事として読む。前の段階の選び直しもできる）
# 今までに決まった事は、コメントの印（factory-talk.py の state）に入れておく。画像は factory-talk ブランチに置く。
# Issue に「全部おまかせ」とあれば、相談せずに今までどおり Factory が全部決めて作る。
# テンプレート本体でだけ、オーナーのIssue・返事でだけ動く。
name: Factory talk

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: factory-talk-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # 何をするか決める：新しい Issue なら案から。返事なら、AIに返事を読ませて次の段階を決める
  route:
    if: >-
      github.event.repository.is_template &&
      (
        (github.event_name == 'issues' &&
         github.event.issue.user.login == github.repository_owner &&
         (startsWith(github.event.issue.title, '新サービス：') || startsWith(github.event.issue.title, '新サービス:')) &&
         !contains(github.event.issue.title, '全部おまかせ') && !contains(github.event.issue.body, '[x] 全部おまかせ'))
        ||
        (github.event_name == 'issue_comment' &&
         !github.event.issue.pull_request &&
         github.event.comment.user.login == github.repository_owner &&
         contains(github.event.issue.labels.*.name, 'factory:talk'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    outputs:
      next: ${{ steps.next.outputs.next }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: 始める（新しい Issue）
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          # ざっくり画面の段を出すか（1 のときだけ。ふだんは見た目の方向で本物の最初の1画面を見せ、そのまま最終確認へ）
          TALK_MOCKS: ${{ vars.FACTORY_TALK_MOCKS }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels" -f "labels[]=factory" -f "labels[]=factory:talk" > /dev/null || echo "::warning::印を付けられませんでした"
          memo="${TITLE#新サービス：}"; memo="${memo#新サービス:}"; memo="$(printf '%s' "$memo" | sed 's/^[[:space:]]*//')"
          detail="$(printf '%s' "$BODY" | tr -d '\r' | head -c 3000 | iconv -c -f utf-8 -t utf-8)"
          mkdir -p talk
          FACTORY_TALK_MOCKS="$TALK_MOCKS" python3 .github/scripts/factory-talk.py init "$memo" "$detail" > talk/state.json
          echo '{"next":"ideas","message":""}' > talk/route.json
      - name: 返事を受け取る
        if: github.event_name == 'issue_comment'
        id: reply
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
          CREATED: ${{ github.event.comment.created_at }}
        run: |
          # 同じ返事で2回動かないように、まず待ちの印を外す（次の選択肢を出すときに付け直す）
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels/factory:wait" > /dev/null 2>&1 || true
          mkdir -p talk
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" | jq -s 'add // []' > talk/comments.json
          python3 .github/scripts/factory-talk.py state talk/comments.json > talk/state.json
          # AIが作っている途中に書かれた返事（今の選択肢が出る前の返事）は、前の段階への返事として読む
          last=$(jq -r '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- factory-talk:v1:")))] | last | .created_at // ""' talk/comments.json)
          rm -f talk/comments.json
          stage=$(jq -r '.stage // ""' talk/state.json)
          if [ "$stage" = "" ]; then echo "::error::相談の記録が見つかりません"; exit 1; fi
          # 作り始めた後のコメントは、相談の返事ではない
          if [ "$stage" = go ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "ai=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$last" ] && [[ "$CREATED" < "$last" ]]; then echo "前の選択肢への返事（$CREATED）" > talk/reply-late.txt; fi
          printf '%s' "$COMMENT" | head -c 4000 > talk/reply.txt
          # agent-desk のボタンからの返事は、形の決まった印が入っている（AIに読ませなくてよい）
          if printf '%s' "$COMMENT" | python3 .github/scripts/factory-talk.py answer > talk/reply.json && [ -s talk/reply.json ]; then
            echo "ai=false" >> "$GITHUB_OUTPUT"
          else
            rm -f talk/reply.json
            echo "ai=true" >> "$GITHUB_OUTPUT"
          fi
      # 文で書かれた返事を、AIが「どれを選んだか・質問の答え・注文」に読み替える（ファイルを書くだけ）
      - uses: anthropics/claude-code-action@v1
        if: steps.reply.outputs.ai == 'true'
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            工場の相談で、オーナーが返事を書きました。`.github/factory/talk.md` の「返事を読む（reply）」のとおりに、`talk/reply.json` を書いてください。
            今の段階と、出した選択肢・質問は `talk/state.json`（stage・ideas・looks・mocks・confirm・ask）、返事は `talk/reply.txt` です（`talk/reply-late.txt` があれば、今の選択肢が出る前に書かれた返事）。ほかのファイルは書かない。
          claude_args: '--model sonnet --max-turns 8 --allowedTools "Read,Write"'
      - name: 次の段階を決める
        if: github.event_name == 'issue_comment' && steps.reply.outputs.skip != 'true'
        run: |
          if [ ! -f talk/reply.json ] || [ -L talk/reply.json ] || ! jq -e 'type == "object"' talk/reply.json > /dev/null 2>&1; then
            echo '{"action":"unclear","message":"返事を読み取れませんでした。番号（例：2）か、やり直してほしい事を書いてください。"}' > talk/reply.json
          fi
          python3 .github/scripts/factory-talk.py apply talk/state.json talk/reply.json > talk/applied.json
          jq '.state' talk/applied.json > talk/state.json
          jq '{next, message}' talk/applied.json > talk/route.json
          rm -f talk/applied.json talk/reply.txt talk/reply.json talk/reply-late.txt
      - name: 次の段階
        id: next
        env:
          SKIP: ${{ steps.reply.outputs.skip }}
        run: |
          if [ "$SKIP" = true ]; then echo "作り始めた後のコメントなので、何もしない"; echo "next=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          next=$(jq -r '.next' talk/route.json)
          case "$next" in ideas | looks | mocks | confirm | go | clarify) ;; *) echo "::error::知らない段階：$next"; exit 1 ;; esac
          echo "次：$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: talk-route
          path: talk/
          retention-days: 3

  # AIが段階の物を作る（案・見た目の方向の板・ざっくり画面・最終確認）。talk/ にファイルを書くだけで、鍵は持たない
  work:
    needs: route
    if: contains(fromJSON('["ideas","looks","mocks","confirm"]'), needs.route.outputs.next)
    runs-on: ubuntu-latest
    # 作る（最大 150 手）＋ 審査1回、まで入る長さ（相談では直さない。オーナーが選ぶので、審査は点と指摘を見せるだけ）
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      NEXT: ${{ needs.route.outputs.next }}
      # 作る役と直す役が使ってよい操作（同じ物）
      MAKER_TOOLS: 'Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node .github/scripts/shot.mjs:*),Bash(node .claude/skills/taste-skill/scripts/draw.mjs:*),Bash(node .claude/skills/taste-skill/scripts/lint.mjs:*),Bash(node .claude/skills/taste-skill/scripts/inspect.mjs:*),Bash(node .claude/skills/taste-skill/scripts/assets.mjs:*)'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: talk-route
          path: talk
      # ざっくり画面は、選んだ方向の板を見ながら作る
      - name: 選んだ方向の板を取る
        if: needs.route.outputs.next == 'mocks'
        run: |
          path=$(jq -r '.assets.looks // ""' talk/state.json); n=$(jq -r '.look // ""' talk/state.json)
          git fetch -q --depth 1 origin factory-talk && git show "FETCH_HEAD:$path/look-$n-1440.png" > talk/chosen-look.png || echo "::warning::選んだ方向の板を取れませんでした"
          # 見た目の方向の段階で書いた設計メモ（持ち物・考えの候補）と、使った絵の出どころも引き継ぐ（無くても続ける）
          git show "FETCH_HEAD:$path/concept.md" > talk/concept.md 2> /dev/null || rm -f talk/concept.md
          git show "FETCH_HEAD:$path/credits.json" > talk/chosen-credits.json 2> /dev/null || rm -f talk/chosen-credits.json
      - name: 撮影の準備
        if: needs.route.outputs.next == 'looks' || needs.route.outputs.next == 'mocks'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null 2>&1 || true
          google-chrome --version || echo "::warning::Chrome が見つかりません（画面を撮れません）"
          .github/scripts/install-ja-fonts.sh
      - name: 手順書とスクリプトを読み取り専用にする
        run: chmod -R a-w .github .claude CLAUDE.md AGENTS.md
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは工場の相談役です。`.github/factory/talk.md` を全部読み、「${{ needs.route.outputs.next }}」の段階を受け持ってください
            （ideas＝1. 案、looks＝2. 見た目の方向、mocks＝3. ざっくり画面、confirm＝4. 最終確認）。
            今までに決まった事は `talk/state.json` です（memo・detail＝オーナーの1行と詳しいメモ、ideas と idea＝出した案と選んだ案、looks と look、mocks と mock、
            answers＝質問の答え、notes＝オーナーの注文。notes に今の段階の注文があれば、前に出した物をそのとおりに直して出し直す）。
            書いてよい場所は `talk/` だけです。
          claude_args: '--model ${{ needs.route.outputs.next == ''confirm'' && ''sonnet'' || ''opus'' }} --max-turns 150 --allowedTools "${{ env.MAKER_TOOLS }}"'
      # ---- 関門と審査（見た目を作る段階だけ。docs/pipeline.md「デザインの仕組み」） ----
      # 機械で測れる事（設計メモの形・本物の絵の枚数・lint の FAIL）はスクリプトが測り、絵を見ないと分からない事は別のAI（審査役）が画像だけを見て答える。
      # 合格かどうかはスクリプトが決める。相談では直さない（直しても点が上がらなかった。11/19 の #250：直し2回で28分、点は上がらず）。
      # 審査は1回で、点と残った指摘を付けてオーナーに見せる（オーナーが選ぶので、厳しい審査役はオーナー本人）。直しと再審査は本番の画面（factory.yml）だけ
      - name: 関門と審査の準備（1 回目）
        id: review1
        if: ${{ !cancelled() && (env.NEXT == 'looks' || env.NEXT == 'mocks') }}
        run: .github/scripts/design-review.sh prepare talk "$NEXT"
      - uses: anthropics/claude-code-action@v1
        id: judge1
        if: ${{ !cancelled() && steps.review1.outputs.ok == 'true' }}
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは審査役です（作ったAIとは別のAI）。`.github/factory/judge.md` を全部読み、そのとおりに、画像だけを見て審査してください。
            - 種類：${{ steps.review1.outputs.mode }}（この種類の問いに全部答える）
            - 審査する物（`items` の `name`）：${{ steps.review1.outputs.items }}。画像は `.judge/made/` にある（名前の頭が物の名前）。look-1〜3 は方向ごとの本物の最初の1画面（-1440 が PC、-390 がスマホ）
            - 比べる実在のサイトは `.judge/refs/`、何のサービスか・オーナーが決めた事は `.judge/brief.md`
            - 書くのは `.judge/verdict.json` だけ。コード・HTML は開かない
          claude_args: '--model opus --max-turns 40 --allowedTools "Read,Glob,Write"'
      - name: 審査の結果（1 回目）
        id: verdict1
        if: ${{ !cancelled() && steps.review1.outputs.ok == 'true' }}
        run: .github/scripts/design-review.sh verdict "${{ steps.review1.outputs.mode }}" 1
      # オーナーに見せる物：審査の点の行と、ざっくり画面の下の欄（2画面目）の絵
      - name: 審査の結果をまとめる
        if: ${{ !cancelled() && (env.NEXT == 'looks' || env.NEXT == 'mocks') }}
        run: |
          .github/scripts/design-review.sh summary talk/judge.md || true
          if [ "$NEXT" = mocks ]; then
            for k in a b; do
              f=".judge/made/mock-$k-1440-s2.png"
              if [ -f "$f" ] && [ ! -L "$f" ]; then cp "$f" "talk/mock-$k-1440-s2.png"; fi
            done
          fi
      # 審査の記録（審査役の答え・指摘の紙・関門・渡した紙）を残す。あとから「なぜ落ちたか」を調べるため
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && (env.NEXT == 'looks' || env.NEXT == 'mocks') }}
        with:
          name: talk-judge-record
          path: |
            .judge/verdict.json
            .judge/fix.md
            .judge/gate.json
            .judge/brief.md
            .judge/lint.json
            .judge-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: talk-out
          path: |
            talk/*.json
            talk/*.html
            talk/look-*-1440.png
            talk/look-*-390.png
            talk/mock-*-1440.png
            talk/mock-*-390.png
            talk/mock-*-1440-s2.png
            talk/concept.md
            talk/img/credits.json
            talk/judge.md
            !talk/state.json
            !talk/route.json
          retention-days: 3

  # 形を確かめて、画像を factory-talk ブランチに置き、オーナーに見せて返事を待つ。「作る」なら Factory を動かす（AIは動かない）
  publish:
    needs: [route, work]
    if: ${{ !cancelled() && needs.route.result == 'success' && needs.route.outputs.next != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v7
        with:
          name: talk-route
          path: talk
      - uses: actions/download-artifact@v7
        if: needs.work.result == 'success'
        continue-on-error: true
        with:
          name: talk-out
          path: out
      - name: 見せる・待つ
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          NEXT: ${{ needs.route.outputs.next }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
          AGENT_DESK_URL: ${{ vars.AGENT_DESK_URL }}
        run: .github/scripts/factory-talk-publish.sh
