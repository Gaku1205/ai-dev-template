# セットアップの診断。新しいリポジトリを作ったら、Actions から1回実行する（結果は実行画面の Summary に出る）。
name: Doctor

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: 診断する
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && '1' || '0' }}
          HAS_PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN != '' && '1' || '0' }}
          HAS_NTFY: ${{ secrets.NTFY_TOPIC != '' && '1' || '0' }}
        run: .github/scripts/doctor.sh | tee -a "$GITHUB_STEP_SUMMARY"
