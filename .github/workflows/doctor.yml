# セットアップの診断。新しいリポジトリを作ったら、Actions から1回実行する（結果は実行画面の Summary に出る）。
name: Doctor

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # パイプラインの鍵：GitHub App があれば、その1時間だけの鍵を使う（回数制限がオーナーと別・期限切れなし）。無ければ PIPELINE_TOKEN
      - name: パイプラインの鍵を作る
        id: app-token
        if: vars.PIPELINE_APP_ID != ''
        # 鍵が作れなくても（秘密鍵の貼り間違いなど）止めずに PIPELINE_TOKEN で続ける。Doctor が ❌ で知らせる
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
      - name: 診断する
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PIPELINE_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && '1' || '0' }}
          HAS_PIPELINE_TOKEN: ${{ (steps.app-token.outputs.token || secrets.PIPELINE_TOKEN) != '' && '1' || '0' }}
          APP_TOKEN_FAILED: ${{ steps.app-token.outcome == 'failure' && '1' || '0' }}
          USING_APP: ${{ steps.app-token.outputs.token != '' && '1' || '0' }}
          HAS_NTFY: ${{ secrets.NTFY_TOPIC != '' && '1' || '0' }}
        run: |
          set -o pipefail
          .github/scripts/doctor.sh | tee -a "$GITHUB_STEP_SUMMARY"
