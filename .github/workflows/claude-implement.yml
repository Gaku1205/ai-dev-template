# 実装AI：Issueに「ai:implement」ラベルを付けると、Claudeがブランチを切って実装する。
# 終わるとIssueにコメントが付き、PRを自動で作る（PIPELINE_TOKEN が無ければ人間がPRを作る）。
# そのあとは pipeline.yml が CI → レビュー → マージ と進める。
#
# モデルはIssueのサイズラベルで切り替える（ラベルは ai:implement より先に付ける）
#   size:S → haiku（文言修正など小さい作業）
#   なし   → sonnet（普段の作業）
#   size:L → opus（設計が絡む大きい作業）
# ターン上限もサイズで変える（S:40 / 無印:60 / L:100）。上限は暴走止めなので、普通の作業は上限より手前で終わる
name: Claude Implement

on:
  issues:
    types: [labeled]

jobs:
  implement:
    # テンプレート本体の「新サービス：」のIssueは工場（factory.yml）が受け持つ。ラベルが付いても、テンプレート自身には作らない
    # ai:skip が付いた Issue（まだ動かさない物・オーナー以外が作って受付が止めた物）では、ラベルが付け直されても始めない
    if: >-
      github.event.label.name == 'ai:implement' &&
      github.event.issue.state == 'open' &&
      !contains(github.event.issue.labels.*.name, 'ai:skip') &&
      !(github.event.repository.is_template && (startsWith(github.event.issue.title, '新サービス：') || startsWith(github.event.issue.title, '新サービス:') || contains(github.event.issue.labels.*.name, 'factory')))
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.claude.outcome }}
      model: ${{ env.MODEL }}
    timeout-minutes: 75
    concurrency:
      group: claude-implement-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      MODEL: ${{ contains(github.event.issue.labels.*.name, 'size:S') && 'haiku' || (contains(github.event.issue.labels.*.name, 'size:L') && 'opus' || 'sonnet') }}
      MAX_TURNS: ${{ contains(github.event.issue.labels.*.name, 'size:S') && '40' || (contains(github.event.issue.labels.*.name, 'size:L') && '100' || '60') }}
      # 長い確認（テスト全体・ビルド）を、AIのコマンドの既定の時間切れ（2分）で裏に回させない。
      # 裏に回すと、AIが「終わったら確かめる」と言って作業を終え、コミットされずに止まる（#125）
      BASH_DEFAULT_TIMEOUT_MS: "600000"
      BASH_MAX_TIMEOUT_MS: "1200000"
    steps:
      # 履歴も全部取る（push の前に main を取り込むため。下の --append-system-prompt）
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # 言語の実行環境と依存を入れる（pipeline.json に合わせる。無ければ今までの Node 22・npm ci）
      - name: 実行環境をそろえる
        id: stack
        uses: ./.github/actions/setup-stack
      # 見た目のテストがあるアプリでは、AIも手元で見た目のテストを動かして確かめられるようにする（位置や数値を測るテストを直すため）
      - name: 見た目のテストがあるか
        id: visual
        run: |
          enabled=false
          if [ -n "${{ steps.stack.outputs.node }}" ] && [ -f package.json ]; then
            enabled=$(jq -r '.scripts["test:visual"] != null' package.json)
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          # AIに許すコマンド（見た目のテストを動かすだけ。基準の画像の撮り直しは --disallowedTools で止める）
          if [ "$enabled" = true ]; then echo "allowed=Bash(npm run test:visual),Bash(npm run test:visual -- -g:*),Bash(npx playwright test:*)" >> "$GITHUB_OUTPUT"; else echo "allowed=" >> "$GITHUB_OUTPUT"; fi
      # ブラウザは actions/cache に置き、apt（Ubuntu のミラー）はライブラリかフォントが足りないときだけ使う（外の障害で落ちにくくする。#255）
      - name: 見た目のテスト用のブラウザのキャッシュ
        if: steps.visual.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 見た目のテスト用のブラウザを入れる
        if: steps.visual.outputs.enabled == 'true'
        run: |
          npx playwright install chromium
          # --with-deps は、ライブラリのほかに日本語などのフォントも入れる（基準の画像はそのフォントで撮ってある）。両方そろっている時だけ apt を飛ばす
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" > /dev/null 2>&1 \
            && dpkg -s fonts-ipafont-gothic fonts-wqy-zenhei fonts-noto-color-emoji > /dev/null 2>&1; then
            echo "ライブラリとフォントはそろっているので、apt は使いません"
          else
            npx playwright install --with-deps chromium
          fi
      # 画面のあるアプリでは、AIが作った画面を本物のブラウザで撮って見て直せるようにする（.github/scripts/shot.mjs。ubuntu-latest の Chrome を使う）。
      # 文字だけで作ると、揃うはずの列のずれ・重なり・空いた帯・弱い主役に気づけないため
      - name: 画面を撮れるか
        id: shots
        run: |
          enabled=false
          if [ -n "${{ steps.stack.outputs.node }}" ] && [ -f package.json ] && [ -f .github/scripts/shot.mjs ] &&
            [ -f .github/scripts/lib/cdp.mjs ] && [ "$(jq -r '.scripts.start != null' package.json)" = true ] &&
            node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)' &&
            { command -v google-chrome > /dev/null || command -v chromium > /dev/null; }; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = true ]; then
            echo "allowed=Bash(npm run build),Bash(node .github/scripts/shot.mjs:*),Bash(.github/scripts/fetch-photos.sh:*)" >> "$GITHUB_OUTPUT"
            echo "prompt=画面に触る作業では、確認コマンドが通ったあと、npm run build をしてから node .github/scripts/shot.mjs --serve / で画面を撮る（ほかのページはパスを並べる。押したり入力したりした後の場面は --steps で書く。使い方はそのファイルの先頭）。390・1440・1920 の幅の画像が .shots/ にできるので、全部 Read で見る。docs/design-ref/ に目標の絵（工場のデザイン担当が撮った画像）があれば見比べる。docs/design.md に「このサービスらしさ」の節があれば、新しい画面・部品はその考え・しるし・通し方で作り（部品を足すだけにしない）、画面を足したら通し表に行を足す。型を消すだけにせず、大きい文字・色の面・本物の素材・中身で埋める（.github/factory/concept.md の 3）。行をまたいで揃うはずの列や数字のずれ・重なり・何も無い大きな帯・左右の片寄り・はみ出し・入力済みに見える例の文字・目立たない主役を探し、目立つ問題の上位3つを直して撮り直す（最大3回）。.shots/ はコミットしない。Issue への報告に、撮って見た場面と直した所を短く書く。写真が要るときは .github/scripts/fetch-photos.sh \"<英語の検索語>\" <枚数> で、自由に使える写真（CC0・パブリックドメイン）が public/photos/ に入る（出どころは public/photos/CREDITS.md。使う物だけコミットする）。" >> "$GITHUB_OUTPUT"
            # 撮った画像をコミットしないように（.gitignore は変えない）
            printf '%s\n' "/.shots/" "/.review/" "/.judge/" "/.judge-results/" >> .git/info/exclude
            # Ubuntu 24.04 は、Chrome の安全な囲い（sandbox）に要る仕組みを止めていることがあるので、使えるようにする
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null 2>&1 || true
            # 日本語のフォントが無いと、canvas のゲームなど Web フォントを読まない画面の日本語が □ で撮れる
            .github/scripts/install-ja-fonts.sh
          else
            echo "allowed=" >> "$GITHUB_OUTPUT"
            echo "prompt=" >> "$GITHUB_OUTPUT"
          fi
      # 目標の画面：オーナーが画面案（claude-mocks.yml）から選んだざっくり画面があれば、ai-mocks ブランチから .shots/target/ に取ってきて、実装AIに渡す
      - name: 目標の画面を取る
        id: target
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          path=$(printf '%s' "$BODY" | grep -oE '<!-- ai-mock: issue-[0-9]+/r[0-9]+/mock-[ab] -->' | tail -1 | sed -E 's/<!-- ai-mock: (.*) -->/\1/' || true)
          if [ -n "$path" ] && git fetch -q --depth 1 origin ai-mocks 2> /dev/null; then
            mkdir -p .shots/target
            for ext in .html -1440.png -390.png -1440-s2.png; do git show "FETCH_HEAD:$path$ext" > ".shots/target/mock$ext" 2> /dev/null || rm -f ".shots/target/mock$ext"; done
            # 画面案のAIが書いた設計メモ（題材の持ち物・考え・通し表）。作り直しのとき、docs/design.md の「このサービスらしさ」の元にする
            git show "FETCH_HEAD:$(dirname "$path")/concept.md" > .shots/target/concept.md 2> /dev/null || rm -f .shots/target/concept.md
            grep -qxF "/.shots/" .git/info/exclude || echo "/.shots/" >> .git/info/exclude
            if [ -f .shots/target/mock.html ]; then
              echo "prompt=オーナーが選んだ目標の画面（ざっくり画面）が .shots/target/ にある（mock.html と、PC の mock-1440.png・スマホの mock-390.png）。Issue の「目標の画面」の注文と合わせて、構図・色・文字・大きさの差をこれに合わせて作り、撮って見比べる（目標の画面の文言と数字は見本なので、本物のデータに置き換える）。mock-1440-s2.png があれば下の欄の続き。.shots/target/concept.md があれば、画面案の設計メモ（題材の持ち物・考え・通し表）：最初の行が「場合: 作り直し」なら、docs/design.md の最初の節「## このサービスらしさ」をこの設計メモから書き直し（形は .github/factory/concept.md の 6）、目標の画面に無い画面も通し表のとおりに同じ考えで作り直す（色を変えただけにしない）。" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "prompt=" >> "$GITHUB_OUTPUT"
      # Issue の本文に貼られた画像（スクショなど）を .shots/issue/ に取ってくる（AIはネットに出ずに Read で見られる。
      # このリポジトリの画像は Contents API で取るので、非公開でも見られる。鍵は github.com・api.github.com にだけ送る）
      - name: Issue の画像を取る
        id: images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.issue.body }}
        run: bash .github/scripts/issue-images-prompt.sh .shots/issue implement
      # パイプラインの App（ボット）がラベル・コメントで起こした実行を、AIのアクションが断らないようにする。
      # AI自身（claude[bot]）は許さない（自分のコメントで自分を呼ぶ繰り返しを防ぐ）。Secret は使わない
      - name: 起こしたボットを許可に入れる
        id: bots
        env:
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          list=""
          if [ "$SENDER_TYPE" = Bot ] && [ "$SENDER" != "claude[bot]" ]; then
            list="${SENDER},${SENDER%\[bot\]}"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      # 進捗ログ：AIが動く前（作業フォルダはまだ main のまま）に「進行中」を残す。終わりは open-pr が残す
      # AIへの指示を部品から組む（見た目のテストの有無・仕様書の長さで、要る部品だけ。compose-prompt.sh・docs/pipeline.md「指示を部品で組む」）
      # Issue のきっかけなので、作業フォルダは main。main の版のスクリプトを使う
      - name: AIへの指示を組む
        id: prompt
        run: |
          text=$(bash .github/scripts/compose-prompt.sh --mode implement --auto | tr -d '\n"')
          echo "text=$text" >> "$GITHUB_OUTPUT"
      - name: 進捗ログ（実装・開始）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: bash .github/scripts/step-log.sh --issue "$ISSUE" --step implement --model "$MODEL" --result running
      - uses: anthropics/claude-code-action@v1
        id: claude
        continue-on-error: true
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "ai:implement"
          claude_args: "--model ${{ env.MODEL }} --max-turns ${{ env.MAX_TURNS }} --allowedTools \"${{ steps.stack.outputs.allowed }},${{ steps.visual.outputs.allowed }},${{ steps.shots.outputs.allowed }},Bash(.github/scripts/tests/run-all.sh),Bash(cat:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(ls:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git fetch:*),Bash(git merge:*),Bash(git checkout --ours:*),Bash(git checkout --theirs:*),Bash(git push:*),Bash(bash .github/scripts/tests/run-all.sh),Bash(bash .github/scripts/tests/:*),Bash(bash .github/scripts/tests/repeat.sh:*),Bash(shellcheck:*),Skill\" --disallowedTools \"Bash(npm run test:visual -- --update-snapshots:*),Bash(npm run test:visual -- -u:*),Bash(npx playwright test --update-snapshots:*),Bash(npx playwright test -u:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git rebase:*)\" --append-system-prompt \"${{ steps.prompt.outputs.text }}${{ steps.shots.outputs.prompt }}${{ steps.target.outputs.prompt }}${{ steps.images.outputs.prompt }}\""
      # 審査役：実装AIとは別のAIが、ワークフローが撮った画面の画像だけを見て、目標の絵（docs/design-ref/）と比べて採点する。
      # 作った本人の「試作とほぼ同じ」をうのみにしない。合格（.github/scripts/design-judge.py が決める）に届かなければ、指摘をつけて実装AIにもう1回だけ直させる
      - name: 審査用に画面を撮る
        id: review_shots
        if: steps.shots.outputs.enabled == 'true' && steps.claude.outcome == 'success'
        continue-on-error: true
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # 実装AIがブランチを作って画面に関わる物を変えたときだけ
          git fetch -q origin "${{ github.event.repository.default_branch }}"
          changed=$(git diff --name-only "origin/${{ github.event.repository.default_branch }}...HEAD" 2> /dev/null | grep -E '^(src/|app/|public/|components/)|\.(css|tsx|jsx)$' || true)
          if [ -z "$changed" ]; then echo "画面に関わる変更が無いので、審査しません"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          rm -rf .review && mkdir -p .review/shots .review/ref
          npm run build > .review/build.log 2>&1 || { echo "ビルドできないので審査しません（CIで分かる）"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }
          steps=(); [ -f .shots/steps.json ] && steps=(--steps .shots/steps.json)
          node .github/scripts/shot.mjs --serve --out .review/shots "${steps[@]}" / || true
          cp docs/design-ref/*.png .review/ref/ 2> /dev/null || true
          if ! ls .review/shots/*.png > /dev/null 2>&1; then echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 審査役に渡す形にそろえる（.github/factory/judge.md）：審査する画像・比べる絵・このサービスらしさ
          rm -rf .judge && mkdir -p .judge/made .judge/refs
          cp .review/shots/*.png .judge/made/
          # 下の欄も見る（最初の1画面だけ凝って、下が型どおりになるのを見逃さない）
          node .github/scripts/shot.mjs --serve --out .judge/made --widths 1440 --scrolls 3 / > /dev/null 2>&1 || true
          n=0; for f in .review/ref/*-1440*.png .shots/target/mock-1440.png; do if [ -f "$f" ] && [ ! -L "$f" ] && [ "$n" -lt 6 ]; then cp "$f" .judge/refs/; n=$((n + 1)); fi; done
          {
            echo "# 審査役に渡す紙"
            echo
            printf '今回の Issue：%s\n\n' "$(printf '%s' "$ISSUE_TITLE" | head -c 200)"
            echo "今あるアプリへの変更（Issue の実装）です。\`.judge/refs/\` は、目標の絵（工場のデザイン担当が最初に作った画面か、オーナーが選んだ画面案）です。実在のほかのサイトではありません。"
            echo
            echo "## このサービスらしさ（docs/design.md から。fits は、新しく足した所がこれに沿っているかで答える。この節が無ければ、目標の絵と同じ作りかで答える）"
            echo
            if [ -f docs/design.md ] && [ ! -L docs/design.md ]; then awk '/^## このサービスらしさ/{on=1; print; next} on && /^## /{exit} on{print}' docs/design.md | head -c 5000; fi
          } > .judge/brief.md
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        id: critic
        if: steps.review_shots.outputs.ok == 'true'
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは審査役です（作ったAIとは別のAI）。`.github/factory/judge.md` を全部読み、そのとおりに、**画像だけ**で審査してください。コード・仕様・Issue は見ないでください。
            - 種類：change（今あるアプリへの変更。この種類の問いに全部答える）
            - 審査する物（`items` の `name`）：change（`.judge/made/` の画像。名前の末尾が幅：390 はスマホ、1440・1920 は PC。`-s2`・`-s3` は下へスクロールした続き）
            - 目標の絵は `.judge/refs/`（無いこともある）、このサービスらしさは `.judge/brief.md`。目標の絵と比べて弱くなった所（主役・余白・文字の大きさや太さ・色）も `fixes` に書く
            - 書くのは `.judge/verdict.json` だけ
          claude_args: '--model opus --max-turns 30 --allowedTools "Read,Glob,Write"'
      # 合格かどうかは、審査役の答えからスクリプトが決める（必ず通す問いが全部「はい」で、7.5 点以上）。結果は .review/critique.md（PRの本文に入る）と .judge/fix.md（直すAIが読む）
      - name: 審査の点数を読む
        id: review_judge
        if: steps.critic.outcome == 'success'
        run: |
          mkdir -p .judge-results .review
          python3 .github/scripts/design-judge.py verdict --mode change .judge/verdict.json --out .judge-results/r1.json --fix .judge/fix.md --critique .review/critique.md > .judge-results/out.txt || true
          cat .judge-results/out.txt
          if grep -qx 'pass=false' .judge-results/out.txt; then echo "redo=true" >> "$GITHUB_OUTPUT"; else echo "redo=false" >> "$GITHUB_OUTPUT"; fi
      - uses: anthropics/claude-code-action@v1
        id: fix
        if: steps.review_judge.outputs.redo == 'true'
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは、Issue #${{ github.event.issue.number }}「${{ github.event.issue.title }}」を実装したAIです。作った画面を、別のAI（審査役）が画像だけで審査し、合格に届きませんでした。
            1. `.judge/fix.md`（直すこと）と、`.judge/made/`（審査に使った画像）・`.judge/refs/`（目標の絵）を見る
            2. 「必ず通す」の「いいえ」を先に、次に「直し」を上から直す。消すだけにしない（消した所は、大きい文字・色の面・本物の素材・中身で埋める。`.github/factory/concept.md` の 3）。直したら確認コマンドを全部通し、`npm run build` → `node .github/scripts/shot.mjs --serve /` で撮り直して、画像を全部 Read で見る
            3. いまのブランチにコミットして `git push origin HEAD` する（push の前に git fetch origin main と git merge origin/main）
            4. Issue へは何も書かなくてよい（審査の結果はPRの本文に自動で入る）
          claude_args: "--model ${{ env.MODEL }} --max-turns 50 --allowedTools \"${{ steps.stack.outputs.allowed }},${{ steps.visual.outputs.allowed }},${{ steps.shots.outputs.allowed }},Bash(.github/scripts/tests/run-all.sh),Bash(cat:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(ls:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git fetch:*),Bash(git merge:*),Bash(git checkout --ours:*),Bash(git checkout --theirs:*),Bash(git push:*),Bash(bash .github/scripts/tests/run-all.sh),Bash(bash .github/scripts/tests/:*),Bash(bash .github/scripts/tests/repeat.sh:*),Bash(shellcheck:*),Skill\" --disallowedTools \"Bash(npm run test:visual -- --update-snapshots:*),Bash(npm run test:visual -- -u:*),Bash(npx playwright test --update-snapshots:*),Bash(npx playwright test -u:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git rebase:*)\" --append-system-prompt \"${{ steps.prompt.outputs.text }}${{ steps.shots.outputs.prompt }}${{ steps.target.outputs.prompt }}${{ steps.images.outputs.prompt }}\""
      # AIの結果（実行記録）を、データとして次のジョブに渡す。ここでは Secret を使わない
      - name: AIの結果を取っておく
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/ai-result"
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then cp "$EXECUTION_FILE" "$RUNNER_TEMP/ai-result/execution.json"; fi
          if [ -f .review/critique.md ] && [ ! -L .review/critique.md ]; then head -c 20000 .review/critique.md > "$RUNNER_TEMP/ai-result/critique.md"; fi
          touch "$RUNNER_TEMP/ai-result/.keep"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: ai-result
          path: ${{ runner.temp }}/ai-result
          include-hidden-files: true
          retention-days: 3

  open-pr:
    # 安全のため別のジョブにする：AIが作業フォルダのスクリプトを書き換えても、ここでは main の版を動かす。
    # PIPELINE_TOKEN を使うのはこのジョブだけ（AIのジョブには渡さない）
    needs: implement
    # AIのジョブが動いたときだけ（別のラベルが付いたときなど、AIのジョブが飛ばされたら何もしない）
    if: ${{ !cancelled() && needs.implement.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # 秘密鍵を PKCS#8 にそろえる（create-github-app-token は Node 24 だと「BEGIN RSA PRIVATE KEY」の形式を読めず Invalid keyData になる）
      - name: パイプラインの鍵の秘密鍵をそろえる
        id: app-key
        if: vars.PIPELINE_APP_ID != ''
        continue-on-error: true
        env:
          KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
        run: |
          # 貼るときに改行が消えて1行になっていても、頭と終わりの行と中身から組み立て直す
          k=$(printf '%s' "$KEY" | tr -d '\r'); k=${k//\\n/$'\n'}
          type=$(printf '%s' "$k" | grep -oE 'BEGIN [A-Z ]*PRIVATE KEY' | head -1 | sed 's/^BEGIN //')
          # 頭と終わりの行が抜けていたら、GitHub App の鍵の形式（RSA）とみなす
          [ -n "$type" ] || type="RSA PRIVATE KEY"
          body=$(printf '%s' "$k" | sed -e 's/-----BEGIN [A-Z ]*PRIVATE KEY-----//' -e 's/-----END [A-Z ]*PRIVATE KEY-----//' | tr -d ' \n\t"')
          pem=$(printf -- '-----BEGIN %s-----\n%s\n-----END %s-----\n' "$type" "$(printf '%s' "$body" | fold -w 64)" "$type" | openssl pkey 2> /dev/null) \
            || { b=no; e=no; case "$k" in *"-----BEGIN"*) b=yes;; esac; case "$k" in *"-----END"*) e=yes;; esac
                 echo "::error::PIPELINE_APP_PRIVATE_KEY を秘密鍵として読めません（.pem の中身を -----BEGIN から -----END まで全部貼る）。手がかり：全体 ${#KEY} 文字・$(printf '%s\n' "$KEY" | wc -l) 行・BEGIN の行 $b・END の行 $e・中身 ${#body} 文字（2048ビットの鍵なら中身は約1,600文字）"; exit 1; }
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo 'pem<<PEM_END'; echo "$pem"; echo 'PEM_END'; } >> "$GITHUB_OUTPUT"
      # パイプラインの鍵：GitHub App があれば、その1時間だけの鍵を使う（回数制限がオーナーと別・期限切れなし）。無ければ PIPELINE_TOKEN
      - name: パイプラインの鍵を作る
        id: app-token
        if: steps.app-key.outputs.pem != ''
        # 鍵が作れなくても（秘密鍵の貼り間違いなど）止めずに PIPELINE_TOKEN で続ける。Doctor が ❌ で知らせる
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ steps.app-key.outputs.pem }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: ai-result
          path: ${{ runner.temp }}/ai-result
      # 何が起きたかを、ログと Summary に残す（拒否された操作と、AIが最後に言ったこと）。ここは main の版のスクリプト
      - name: AIの結果を残す
        continue-on-error: true
        run: bash .github/scripts/ai-report.sh --title "実装AI" "$RUNNER_TEMP/ai-result/execution.json" || true
      - name: PRを作る（作業回数の上限で止まっても、変更があればPRにしてCIで確かめる）
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
          AGENT_DESK_URL: ${{ vars.AGENT_DESK_URL }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          AI_OUTCOME: ${{ needs.implement.outputs.outcome }}
          EXECUTION_FILE: ${{ runner.temp }}/ai-result/execution.json
          CRITIQUE_FILE: ${{ runner.temp }}/ai-result/critique.md
        run: .github/scripts/open-pr.sh
      # 進捗ログ：実装の結果は「PRができたか」で決める。AIのアクションは、作業回数の上限を超えると、仕事が終わっていても失敗で終わる
      # （それでも変更があればPRにする。上の工程）。AIの終わり方ではなく、PRの有無を見ないと、進んでいるのに「失敗」と出てしまう
      - name: 進捗ログ（実装・終了）
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          MODEL: ${{ needs.implement.outputs.model }}
        run: |
          made=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq "[.[] | select(.head.ref | startswith(\"claude/issue-${ISSUE}-\"))] | length" 2> /dev/null) || made=0
          if [ "${made:-0}" -gt 0 ]; then result=success; else result=failure; fi
          bash .github/scripts/step-log.sh --issue "$ISSUE" --step implement --model "${MODEL:-null}" --result "$result"
