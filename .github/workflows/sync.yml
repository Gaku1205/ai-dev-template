# ai-dev-template の main が更新され、CI（スクリプトのテストを含む）が通ったら、アプリのリポジトリへ .github と docs/pipeline.md を自動で配る。
# CIが落ちた版は配らない（壊れた版が、アプリ全部の main に入らないように）。
# 配り先は .github/sync-targets（1行に1つ）。ワークフローも配るため、PIPELINE_TOKEN に Workflows (Read and write) 権限が要る。
name: Sync to apps

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-apps
  cancel-in-progress: false

jobs:
  sync:
    # テンプレート（本体）でだけ動かす。配り先・テンプレートから作ったリポジトリでは動かない
    if: >-
      github.event.repository.is_template &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CIが通った版そのものを配る
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: アプリへ配る
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          mapfile -t targets < <(grep -vE '^[[:space:]]*(#|$)' .github/sync-targets 2> /dev/null || true)
          if [ "${#targets[@]}" -eq 0 ]; then echo "配り先がありません（.github/sync-targets）"; exit 0; fi
          .github/scripts/sync-to-apps.sh "${targets[@]}"
