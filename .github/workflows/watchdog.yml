# 見張り役：定期的に（GitHubの都合で、混んでいると数時間あくことがある）と、ほかのワークフローが終わるたびに、パイプラインが止まったまま動かなくなっていないか見て、自動で再開させる。
#   ・使用量の上限やAIのエラーで止まった物（ai:retry）を、時間をおいてやり直す
#   ・時間切れなどで、失敗の知らせも無いまま止まっている物を見つけてやり直す
#   ・CIが承認待ちで止まっている物を動かし直す
#   ・順番待ち（ai:queue）を進める
# 人間の確認待ち（ai:stuck）は触らない。やり直しは10回まで（超えたら ai:stuck で人間に回す）。
# 手で動かすこともできる（Actions → Watchdog → Run workflow）。
name: Watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  # 定期の起動は大きく遅れることがあるので、AIやCIの実行が終わるたびにも見張る（止まりに早く気づく）
  workflow_run:
    workflows: ["Claude Plan", "Claude Implement", "Claude Review", "Claude Mention", "CI", "Intake"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # 秘密鍵を PKCS#8 にそろえる（create-github-app-token は Node 24 だと「BEGIN RSA PRIVATE KEY」の形式を読めず Invalid keyData になる）
      - name: パイプラインの鍵の秘密鍵をそろえる
        id: app-key
        if: vars.PIPELINE_APP_ID != ''
        continue-on-error: true
        env:
          KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
        run: |
          pem=$(printf '%s\n' "$KEY" | tr -d '\r' | openssl pkey 2> /dev/null) || { echo "::error::PIPELINE_APP_PRIVATE_KEY を秘密鍵として読めません（.pem の中身を -----BEGIN から -----END まで全部貼る）"; exit 1; }
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo 'pem<<PEM_END'; echo "$pem"; echo 'PEM_END'; } >> "$GITHUB_OUTPUT"
      # パイプラインの鍵：GitHub App があれば、その1時間だけの鍵を使う（回数制限がオーナーと別・期限切れなし）。無ければ PIPELINE_TOKEN
      - name: パイプラインの鍵を作る
        id: app-token
        if: steps.app-key.outputs.pem != ''
        # 鍵が作れなくても（秘密鍵の貼り間違いなど）止めずに PIPELINE_TOKEN で続ける。Doctor が ❌ で知らせる
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ steps.app-key.outputs.pem }}
      - uses: actions/checkout@v6
      - name: 見張る
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
          AGENT_DESK_URL: ${{ vars.AGENT_DESK_URL }}
        run: .github/scripts/watchdog.sh
