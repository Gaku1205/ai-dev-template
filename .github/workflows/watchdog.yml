# 見張り役：定期的に（GitHubの都合で、混んでいると数時間あくことがある）と、ほかのワークフローが終わるたびに、パイプラインが止まったまま動かなくなっていないか見て、自動で再開させる。
#   ・使用量の上限やAIのエラーで止まった物（ai:retry）を、時間をおいてやり直す
#   ・時間切れなどで、失敗の知らせも無いまま止まっている物を見つけてやり直す
#   ・CIが承認待ちで止まっている物を動かし直す
#   ・順番待ち（ai:queue）を進める
# 人間の確認待ち（ai:stuck）は触らない。やり直しは10回まで（超えたら ai:stuck で人間に回す）。
# 手で動かすこともできる（Actions → Watchdog → Run workflow）。
name: Watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  # 定期の起動は大きく遅れることがあるので、AIやCIの実行が終わるたびにも見張る（止まりに早く気づく）
  workflow_run:
    workflows: ["Claude Plan", "Claude Implement", "Claude Review", "Claude Mention", "CI", "Intake"]
    types: [completed]
  workflow_dispatch:

# 並列の上限（agent-desk の設定が Actions の Variable に書く。pipeline-lib.sh の parallel_limit_decide が読む）。
# 渡していなかったので、設定で昼の数を変えても、いつも既定の3で動いていた（2026-11-18）
env:
  PARALLEL_DAY: ${{ vars.PARALLEL_DAY }}
  PARALLEL_NIGHT: ${{ vars.PARALLEL_NIGHT }}
  PARALLEL_NIGHT_HOURS: ${{ vars.PARALLEL_NIGHT_HOURS }}
  PARALLEL_TZ: ${{ vars.PARALLEL_TZ }}
  PARALLEL_OVERRIDE: ${{ vars.PARALLEL_OVERRIDE }}
  MAX_PARALLEL: ${{ vars.MAX_PARALLEL }}

# 待ちの実行は1つだけ残り、新しい物に置き換えられる。飛ばされる実行（ジョブの if が偽）が本物の待ちを置き換えて消さないよう、
# 飛ばされる実行は別の組にする（ジョブの if と同じ条件。#200・queue.yml と同じ形）
concurrency:
  group: >-
    ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped') && 'watchdog' || format('watchdog-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  watch:
    # 何もしなかった実行（skipped）の後には動かない。どの Issue・PR にコメントが付いても Claude Mention が起動して
    # すぐ skipped で終わるので、そのたびに全部を見直すと GitHub API の回数を無駄に使う（定期の30分ごとは今まで通り）
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # actions: write は、次のやり直しの時刻に目覚まし（retry-timer.yml）を動かすため
      actions: write
      # マージのやり直し（CI 以外のチェックが通っていなかったPR）で、先頭コミットのチェックを読むため
      checks: read
      statuses: read
    steps:
      # 秘密鍵を PKCS#8 にそろえる（create-github-app-token は Node 24 だと「BEGIN RSA PRIVATE KEY」の形式を読めず Invalid keyData になる）
      - name: パイプラインの鍵の秘密鍵をそろえる
        id: app-key
        if: vars.PIPELINE_APP_ID != ''
        continue-on-error: true
        env:
          KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
        run: |
          # 貼るときに改行が消えて1行になっていても、頭と終わりの行と中身から組み立て直す
          k=$(printf '%s' "$KEY" | tr -d '\r'); k=${k//\\n/$'\n'}
          type=$(printf '%s' "$k" | grep -oE 'BEGIN [A-Z ]*PRIVATE KEY' | head -1 | sed 's/^BEGIN //')
          # 頭と終わりの行が抜けていたら、GitHub App の鍵の形式（RSA）とみなす
          [ -n "$type" ] || type="RSA PRIVATE KEY"
          body=$(printf '%s' "$k" | sed -e 's/-----BEGIN [A-Z ]*PRIVATE KEY-----//' -e 's/-----END [A-Z ]*PRIVATE KEY-----//' | tr -d ' \n\t"')
          pem=$(printf -- '-----BEGIN %s-----\n%s\n-----END %s-----\n' "$type" "$(printf '%s' "$body" | fold -w 64)" "$type" | openssl pkey 2> /dev/null) \
            || { b=no; e=no; case "$k" in *"-----BEGIN"*) b=yes;; esac; case "$k" in *"-----END"*) e=yes;; esac
                 echo "::error::PIPELINE_APP_PRIVATE_KEY を秘密鍵として読めません（.pem の中身を -----BEGIN から -----END まで全部貼る）。手がかり：全体 ${#KEY} 文字・$(printf '%s\n' "$KEY" | wc -l) 行・BEGIN の行 $b・END の行 $e・中身 ${#body} 文字（2048ビットの鍵なら中身は約1,600文字）"; exit 1; }
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo 'pem<<PEM_END'; echo "$pem"; echo 'PEM_END'; } >> "$GITHUB_OUTPUT"
      # パイプラインの鍵：GitHub App があれば、その1時間だけの鍵を使う（回数制限がオーナーと別・期限切れなし）。無ければ PIPELINE_TOKEN
      - name: パイプラインの鍵を作る
        id: app-token
        if: steps.app-key.outputs.pem != ''
        # 鍵が作れなくても（秘密鍵の貼り間違いなど）止めずに PIPELINE_TOKEN で続ける。Doctor が ❌ で知らせる
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ steps.app-key.outputs.pem }}
          # 並列の上限を全部のリポジトリで数える（#216）ため、持ち主のリポジトリ全部に効く鍵にする（AIが動かないジョブ）
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: 見張る
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
          MAX_CONFLICT_FIX: ${{ vars.MAX_CONFLICT_FIX }}
          AGENT_DESK_URL: ${{ vars.AGENT_DESK_URL }}
          RETRY_TIMER: ${{ vars.RETRY_TIMER }}
        run: .github/scripts/watchdog.sh
      # agent-desk の自己点検（#256）と CPU の予算の知らせ。テンプレート本体だけで呼ぶ（配ったアプリの見張り役まで呼ぶと、同じ点検が何重にもなる）。
      # schedule の event には repository が無いことがあるので、テンプレートかどうかは API で確かめる。失敗しても見張りは止めない
      - name: agent-desk の自己点検を呼ぶ
        if: vars.AGENT_DESK_URL != '' && github.event_name != 'workflow_run'
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AGENT_DESK_URL: ${{ vars.AGENT_DESK_URL }}
          REPO: ${{ github.repository }}
          # 答えの budget（CPU の予算。agent-desk#698）が warn・over なら、スマホに知らせる（同じ日・同じ段で1回）
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
        run: |
          [ -n "$GH_TOKEN" ] || exit 0
          [ "$(gh api "repos/$REPO" --jq .is_template 2>/dev/null)" = true ] || exit 0
          bash .github/scripts/selfcheck-call.sh
