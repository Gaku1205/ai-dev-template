# パイプラインで使うラベルを作る（すでにあれば色と説明をそろえる）。
# テンプレートから作ったリポジトリで、最初に1回 Actions から実行する。
name: Setup Labels

on:
  workflow_dispatch:
  # ラベルの一覧（labels.sh）が変わったら、自動でそろえる（テンプレートからの配布で新しいラベルが増えたとき、人間が手で実行しなくてよいように）
  push:
    branches: [main]
    paths:
      - .github/scripts/labels.sh

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v6
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          # push で動いたとき：Bootstrap（最初の push でラベルを作り、CLAUDE.md を整える）がまだなら何もしない。
          # 先にラベルを作ると、Bootstrap が「もう済んでいる」とみなして何もしなくなるため
          if [ "$EVENT" = push ] && ! gh api "repos/$REPO/labels/ai%3Aplan" > /dev/null 2>&1; then
            echo "Bootstrap がまだなので、何もしません（Bootstrap がラベルを作ります）"
            exit 0
          fi
          .github/scripts/labels.sh
