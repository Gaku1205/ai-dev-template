# 見た目のテストの基準の画像を、CIと同じ環境で撮り直してPRのブランチにコミットする。
# PRに「visual:update」ラベルを付けると動く（終わるとラベルは外れる）。
# 文字の描き方はパソコンごとに少し違うので、基準の画像はCIの環境で撮った物にそろえる。
# 見た目をわざと変えたPRや、初めて基準の画像を作るPRで使う。
# 安全のため2段に分ける：撮り直し（PRのコードを動かす。Secret を渡さない）→ 画像だけ取り出してコミット（Secret を使う。PRのコードは動かさない）。
name: Visual Update

on:
  pull_request:
    types: [labeled]

jobs:
  shoot:
    if: >-
      github.event.label.name == 'visual:update' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: visual-update-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # ここではPRのコードを動かすので、Secret は使わず、トークンも残さない
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 基準の画像を撮り直す
        run: npm run test:visual -- --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/visual
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: shoot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # ここではPRのコードを動かさない（npm も実行しない）。画像（png）だけを取り出す
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.PIPELINE_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: visual-snapshots
          path: ${{ runner.temp }}/snap
      - name: 変わった画像をコミットする
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SNAP: ${{ runner.temp }}/snap
        run: |
          git config user.name "pipeline"
          git config user.email "noreply@github.com"
          (cd "$SNAP" && find . -type f -name '*.png' -print0) | while IFS= read -r -d '' f; do
            mkdir -p "tests/visual/$(dirname "$f")"
            cp "$SNAP/$f" "tests/visual/$f"
          done
          git add -A tests/visual
          if git diff --cached --quiet; then
            echo "基準の画像に変わりはありません"
          else
            git commit -m "見た目のテスト：基準の画像をCIの環境で撮り直す"
            git push origin "HEAD:$BRANCH"
          fi

  unlabel:
    needs: [shoot, commit]
    if: always() && github.event.label.name == 'visual:update' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ラベルを外す
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/visual%3Aupdate" > /dev/null || true
