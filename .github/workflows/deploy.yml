# 公開：main の CI が通ったら、pipeline.json の deploy に書いた公開先へ出す（docs/pipeline-setup.md「言語と公開先」）。
#   aws-apprunner   Docker のイメージを作り、AWS App Runner で動かす（Web・API。言語を選ばない）
#   github-release  OS ごとに配布物（exe など）を作り、GitHub Releases に置く（外部のアカウント不要）
#   expo            スマホアプリを Expo（EAS）で配る
#   github-pages    静的なサイトを作って GitHub Pages に出す（build：作るコマンド、既定 npm run build。dir：出すフォルダ、既定 out。
#                   Next.js なら next.config で output: "export" にしておく。Settings → Pages の Source を「GitHub Actions」にしておく）
#   supabase        supabase/migrations/*.sql のうち、まだ流していない物を番号の順に流す（会員と課金のサービス。Secret の SUPABASE_DB_URL。工場が入れる）
#   vercel          ここでは何もしない（deploy-vercel.yml が、マージが落ち着いてから最新の main を1回だけ公開する。VERCEL_TOKEN が無ければ Vercel が自分で公開する。pipeline.json が無いときの既定）
# 結果はコミットの状態（deploy/<種類>）に書き、スマホに通知する。パイプラインの更新だけのコミットは公開しない。
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    # main への push で CI が通ったときだけ（PR の CI では動かない）。テンプレート（本体）では動かさない
    if: >-
      !github.event.repository.is_template &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # 前のコミットの公開の結果（deploy/*）を読む（まだ公開されていないアプリの変更が残っていないかを見る）
      statuses: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      apprunner: ${{ steps.plan.outputs.apprunner }}
      apprunner_config: ${{ steps.plan.outputs.apprunner_config }}
      release: ${{ steps.plan.outputs.release }}
      release_config: ${{ steps.plan.outputs.release_config }}
      release_os: ${{ steps.plan.outputs.release_os }}
      expo: ${{ steps.plan.outputs.expo }}
      expo_config: ${{ steps.plan.outputs.expo_config }}
      pages: ${{ steps.plan.outputs.pages }}
      pages_config: ${{ steps.plan.outputs.pages_config }}
      supabase: ${{ steps.plan.outputs.supabase }}
    steps:
      - id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          # CI が通った版そのものを公開する。直前のコミットと比べるので2つ取る
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        env:
          # パイプラインの更新だけのコミットでも、前のアプリの変更がまだ公開されていなければ公開する（deploy-plan.sh がさかのぼって調べる）
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: .github/scripts/deploy-plan.sh

  apprunner:
    needs: plan
    if: needs.plan.outputs.apprunner == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
      # AWS の鍵を置かず、GitHub の OIDC で AWS の役割を一時的に借りる
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - run: .github/scripts/deploy-status.sh aws-apprunner pending "AWS App Runner に公開中"
      - name: AWS の設定があるか
        id: vars
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
          ACCESS: ${{ vars.AWS_APPRUNNER_ACCESS_ROLE_ARN }}
        run: |
          missing=""
          [ -n "$ROLE" ] || missing="$missing AWS_ROLE_ARN"
          [ -n "$REGION" ] || missing="$missing AWS_REGION"
          [ -n "$ACCESS" ] || missing="$missing AWS_APPRUNNER_ACCESS_ROLE_ARN"
          if [ -n "$missing" ]; then
            echo "::error::Actions の Variable が無い：${missing}（docs/pipeline-setup.md「AWS App Runner」の手順）"
            .github/scripts/deploy-status.sh aws-apprunner error "AWS の設定がまだです（Variable：${missing# }）"
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: App Runner に公開する
        id: deploy
        env:
          CONFIG: ${{ needs.plan.outputs.apprunner_config }}
          ACCESS_ROLE_ARN: ${{ vars.AWS_APPRUNNER_ACCESS_ROLE_ARN }}
        run: .github/scripts/deploy-apprunner.sh
      - if: success()
        run: .github/scripts/deploy-status.sh aws-apprunner success "AWS App Runner に公開しました" "${{ steps.deploy.outputs.url }}"
      # 設定が無いとき（上で書いた）以外の失敗：役割を借りられない・イメージが作れない・App Runner の失敗など
      - if: failure() && steps.vars.outcome == 'success'
        run: .github/scripts/deploy-status.sh aws-apprunner failure "App Runner への公開が失敗しました（ログを見てください）" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release-build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.release_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: 実行環境をそろえる
        uses: ./.github/actions/setup-stack
      - name: 配布物を作る
        shell: bash
        env:
          CONFIG: ${{ needs.plan.outputs.release_config }}
        run: |
          build=$(jq -r '.build' <<< "$CONFIG")
          echo "作る：$build"
          bash -eo pipefail -c "$build"
      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.os }}
          path: ${{ fromJSON(needs.plan.outputs.release_config).files }}
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [plan, release-build]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      RELEASE_OS: ${{ needs.plan.outputs.release_os }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: 作れなかった OS があれば失敗にする
        if: needs.release-build.result != 'success'
        run: |
          .github/scripts/deploy-status.sh github-release failure "配布物を作れませんでした（どれかの OS で失敗）" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
      - uses: actions/download-artifact@v7
        with:
          path: dist-all
          pattern: build-*
      - name: GitHub Releases に置く
        id: rel
        run: .github/scripts/deploy-release.sh dist-all
      - if: success()
        run: .github/scripts/deploy-status.sh github-release success "GitHub Releases に置きました" "${{ steps.rel.outputs.url }}"
      - if: failure() && needs.release-build.result == 'success'
        run: .github/scripts/deploy-status.sh github-release failure "GitHub Releases に置けませんでした" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  expo:
    needs: plan
    if: needs.plan.outputs.expo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Expo の鍵があるか
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret の EXPO_TOKEN が無い（docs/pipeline-setup.md「Expo」の手順）"
            .github/scripts/deploy-status.sh expo error "Expo の設定がまだです（Secret：EXPO_TOKEN）"
            exit 1
          fi
          .github/scripts/deploy-status.sh expo pending "Expo で配布中"
      - name: 実行環境をそろえる
        uses: ./.github/actions/setup-stack
      - name: Expo で配る
        id: eas
        env:
          CONFIG: ${{ needs.plan.outputs.expo_config }}
        run: |
          cmd=$(jq -r '.command // "npx --yes eas-cli@latest update --auto --non-interactive"' <<< "$CONFIG")
          echo "配る：$cmd"
          bash -eo pipefail -c "$cmd"
      - if: success()
        run: .github/scripts/deploy-status.sh expo success "Expo で配りました" "https://expo.dev"
      - if: failure() && steps.token.outcome == 'success'
        run: .github/scripts/deploy-status.sh expo failure "Expo での配布が失敗しました" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # 表の変更：Vercel の公開（deploy-vercel.yml。CI のあと少し待ってから動く）より先に流す
  supabase:
    needs: plan
    if: needs.plan.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - run: .github/scripts/deploy-status.sh supabase pending "表の変更を流しています"
      - name: 表の変更を流す
        id: migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: .github/scripts/deploy-supabase.sh
      - if: success()
        run: .github/scripts/deploy-status.sh supabase success "表の変更を流しました（${{ steps.migrate.outputs.applied }} 個）"
      - if: failure()
        run: .github/scripts/deploy-status.sh supabase failure "表の変更を流せませんでした（ログを見てください）" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Pages がまだ有効でなければ有効にする（Source を GitHub Actions に）。github.token にはその権限が無いので、パイプラインの鍵で。
  # 11/20、Vercel から移した senpai-warikan で、Pages が無効のまま公開が 404 で落ちた（マネージャーの環境から Pages の API が通らず、移す時に有効にできなかった）
  # 鍵（PIPELINE_TOKEN・App の秘密鍵）は、アプリのコード（npm ci・build）が動くジョブに渡さないので、別のジョブに分ける。checkout もしない
  pages-enable:
    needs: plan
    if: needs.plan.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      # 秘密鍵を PKCS#8 にそろえる（create-github-app-token は Node 24 だと「BEGIN RSA PRIVATE KEY」の形式を読めず Invalid keyData になる）
      - name: パイプラインの鍵の秘密鍵をそろえる
        id: app-key
        if: vars.PIPELINE_APP_ID != ''
        continue-on-error: true
        env:
          KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
        run: |
          # 貼るときに改行が消えて1行になっていても、頭と終わりの行と中身から組み立て直す
          k=$(printf '%s' "$KEY" | tr -d '\r'); k=${k//\\n/$'\n'}
          type=$(printf '%s' "$k" | grep -oE 'BEGIN [A-Z ]*PRIVATE KEY' | head -1 | sed 's/^BEGIN //')
          # 頭と終わりの行が抜けていたら、GitHub App の鍵の形式（RSA）とみなす
          [ -n "$type" ] || type="RSA PRIVATE KEY"
          body=$(printf '%s' "$k" | sed -e 's/-----BEGIN [A-Z ]*PRIVATE KEY-----//' -e 's/-----END [A-Z ]*PRIVATE KEY-----//' | tr -d ' \n\t"')
          pem=$(printf -- '-----BEGIN %s-----\n%s\n-----END %s-----\n' "$type" "$(printf '%s' "$body" | fold -w 64)" "$type" | openssl pkey 2> /dev/null) \
            || { b=no; e=no; case "$k" in *"-----BEGIN"*) b=yes;; esac; case "$k" in *"-----END"*) e=yes;; esac
                 echo "::error::PIPELINE_APP_PRIVATE_KEY を秘密鍵として読めません（.pem の中身を -----BEGIN から -----END まで全部貼る）。手がかり：全体 ${#KEY} 文字・$(printf '%s\n' "$KEY" | wc -l) 行・BEGIN の行 $b・END の行 $e・中身 ${#body} 文字（2048ビットの鍵なら中身は約1,600文字）"; exit 1; }
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo 'pem<<PEM_END'; echo "$pem"; echo 'PEM_END'; } >> "$GITHUB_OUTPUT"
      # パイプラインの鍵：GitHub App があれば、その1時間だけの鍵を使う（回数制限がオーナーと別・期限切れなし）。無ければ PIPELINE_TOKEN
      - name: パイプラインの鍵を作る
        id: app-token
        if: steps.app-key.outputs.pem != ''
        # 鍵が作れなくても（秘密鍵の貼り間違いなど）止めずに PIPELINE_TOKEN で続ける。Doctor が ❌ で知らせる
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ steps.app-key.outputs.pem }}
      - name: GitHub Pages を有効にする（まだなら）
        continue-on-error: true
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT: ${{ secrets.PIPELINE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # App の鍵に Pages を変える権限が無いこともあるので、だめなら PIPELINE_TOKEN でもう一度
          for t in "$APP_TOKEN" "$PAT"; do
            [ -n "$t" ] || continue
            if GH_TOKEN="$t" gh api "repos/$REPO/pages" > /dev/null 2>&1; then echo "Pages はもう有効です"; exit 0; fi
            if GH_TOKEN="$t" gh api -X POST "repos/$REPO/pages" -f build_type=workflow > /dev/null 2>&1; then echo "Pages を有効にしました（Source：GitHub Actions）"; exit 0; fi
          done
          echo "::warning::Pages を有効にできませんでした。Settings → Pages の Source を GitHub Actions にしてください"

  pages:
    needs: [plan, pages-enable]
    # 有効にする段がうまくいかなくても（鍵が無いなど）、公開は今まで通り試す
    if: ${{ !cancelled() && needs.plan.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - run: .github/scripts/deploy-status.sh pages pending "GitHub Pages に公開中"
      - name: 実行環境をそろえる
        uses: ./.github/actions/setup-stack
      - name: サイトを作る
        id: build
        env:
          CONFIG: ${{ needs.plan.outputs.pages_config }}
        run: |
          cmd=$(jq -r '.build // "npm run build"' <<< "$CONFIG")
          dir=$(jq -r '.dir // "out"' <<< "$CONFIG")
          echo "作る：$cmd（出すフォルダ：$dir）"
          bash -eo pipefail -c "$cmd"
          if [ ! -f "$dir/index.html" ]; then
            echo "::error::$dir/index.html がありません（Next.js なら next.config で output: \"export\" にする）"
            exit 1
          fi
          touch "$dir/.nojekyll"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.build.outputs.dir }}
      - id: deploy
        uses: actions/deploy-pages@v4
      - if: success()
        run: .github/scripts/deploy-status.sh pages success "GitHub Pages に公開しました" "${{ steps.deploy.outputs.page_url }}"
      - if: failure()
        run: .github/scripts/deploy-status.sh pages failure "GitHub Pages への公開が失敗しました（Settings → Pages の Source が「GitHub Actions」か確かめる）" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
