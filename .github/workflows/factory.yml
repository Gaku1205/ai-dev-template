# 工場：ai-dev-template に「新サービス：〜」で始まるIssueを1行書くと、新しいサービスのリポジトリを作って、いつものパイプラインに渡す。
#   例：「新サービス：毎朝の天気と予定を1枚で見られるページ」
# 名前・言語（Next.js か Python）・1行の説明をAIが決め、Next.js ならデザイン担当が実例を集めてから本物の画面を作り、あとは factory.sh が行う（リポジトリ作成・秘密と変数のコピー・
# Vercel・main の保護・最初のIssue）。最初の1回だけ、Environment「factory」に FACTORY_TOKEN（と、Next.js を公開するなら VERCEL_TOKEN）の登録が要る（docs/pipeline.md「工場」）。
# テンプレート本体でだけ、オーナーが書いたIssueでだけ動く（公開リポジトリなので、ほかの人のIssueでは動かない）。
name: Factory

on:
  issues:
    types: [opened]

jobs:
  plan:
    if: >-
      github.event.repository.is_template &&
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '新サービス：') || startsWith(github.event.issue.title, '新サービス:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    outputs:
      name: ${{ steps.check.outputs.name }}
      stack: ${{ steps.check.outputs.stack }}
      desc: ${{ steps.check.outputs.desc }}
      memo: ${{ steps.check.outputs.memo }}
      detail: ${{ steps.memo.outputs.detail }}
    steps:
      # 工場のIssueの印。題が書き換えられても、テンプレート自身で企画・実装が走らないようにする（claude-plan.yml・claude-implement.yml が見る）
      - name: 工場の印を付ける
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels" -f "labels[]=factory" > /dev/null || echo "::warning::factory の印を付けられませんでした"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: メモを取り出す
        id: memo
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          memo="${TITLE#新サービス：}"; memo="${memo#新サービス:}"; memo="$(printf '%s' "$memo" | sed 's/^[[:space:]]*//')"
          { echo 'memo<<MEMO_END'; printf '%s\n' "$memo"; echo 'MEMO_END'; } >> "$GITHUB_OUTPUT"
          # Issue の本文は「詳しいメモ」（載せたい中身・見た目のスタイルなど。任意、3000文字まで）
          detail="$(printf '%s' "$BODY" | tr -d '\r' | grep -v '^DETAIL_END$' | head -c 3000 | iconv -c -f utf-8 -t utf-8)"
          { echo 'detail<<DETAIL_END'; printf '%s\n' "$detail"; echo 'DETAIL_END'; } >> "$GITHUB_OUTPUT"
      # AIは名前・言語・説明を決めて、ファイルに書くだけ（ほかの操作は許さない。鍵も渡さない）
      - uses: anthropics/claude-code-action@v1
        id: claude
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            オーナーが、新しく作りたいサービスを1行のメモに書きました。
            メモ：${{ steps.memo.outputs.memo }}
            詳しいメモ（あれば）：
            ${{ steps.memo.outputs.detail }}

            このサービスのリポジトリを作るために、次の3つを決め、`factory-plan.json` に JSON で書いてください（ほかのファイルは作らない）。
            {"name": "...", "stack": "...", "description": "..."}
            - name：リポジトリの名前。中身が分かる短い英語を、小文字の英数字と - でつなぐ（3〜39文字、先頭は英字。例：morning-board、receipt-sorter）
            - stack：nextjs・python・game のどれか
              - 人が画面で使うWebのサービス（ページ・ダッシュボード・ツール）なら nextjs
              - 画面よりも処理が中心の物（API・データ処理・機械学習・定期的に動く処理）なら python
              - ゲーム（遊ぶ物。Windows の exe で配る）なら game
              - 迷ったら nextjs
            - description：何のサービスかを、日本語で1文（120文字以内。改行・バッククォートは使わない）
          claude_args: '--model sonnet --max-turns 5 --allowedTools "Write"'
      - name: AIが決めた物を確かめる
        id: check
        env:
          MEMO: ${{ steps.memo.outputs.memo }}
        run: |
          f=factory-plan.json
          if [ ! -f "$f" ] || [ -L "$f" ] || ! jq -e 'type == "object"' "$f" > /dev/null 2>&1; then
            echo "::error::AIが factory-plan.json を書きませんでした"; exit 1
          fi
          name=$(jq -r '.name // ""' "$f"); stack=$(jq -r '.stack // ""' "$f"); desc=$(jq -r '.description // ""' "$f" | tr -d '\n`')
          [[ "$name" =~ ^[a-z][a-z0-9-]{2,38}$ ]] || { echo "::error::名前「$name」の形が違います"; exit 1; }
          case "$stack" in nextjs | python | game) ;; *) echo "::error::言語「$stack」は nextjs・python・game のどれか"; exit 1 ;; esac
          [ -n "$desc" ] || { echo "::error::説明がありません"; exit 1; }
          desc="${desc:0:120}"
          echo "名前：$name／言語：$stack／説明：$desc"
          { echo "name=$name"; echo "stack=$stack"; echo "desc<<DESC_END"; echo "$desc"; echo "DESC_END";
            echo "memo<<MEMO_END"; printf '%s\n' "$MEMO"; echo "MEMO_END"; } >> "$GITHUB_OUTPUT"

  # デザイン担当（Next.js のときだけ）：.github/factory/design-department.md。決まりは「読める・押せる・スマホで崩れない・写さない」だけ。
  # 1. Issue に貼られた画像（オーナーの「こういうのが良い」）を取ってくる
  # 2. デザイン担当（AI）が、実在の良いサイトを探して撮り、参考の板を作ってから方向を決め、本物の Next.js の画面を作って、撮って実例と見比べて直す
  # 3. 確認コマンド（typecheck・lint・test・build）を通す。通らなければ1回だけ直させる
  # 4. 最後の画面を撮る（新しいリポジトリの docs/design-ref/ に入り、あとの Issue の目標の絵になる）
  # 作った src/・public/・docs/design.md は、build ジョブ（factory.sh）が形を確かめてから新しいリポジトリに入れる。
  # AIはファイルを書くことと、決まったコマンドを動かすことだけ（鍵は持たない）
  design:
    needs: plan
    if: needs.plan.outputs.stack == 'nextjs' || needs.plan.outputs.stack == 'game'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # 撮影（shot.mjs）は Node 22 以上が要る。撮影は ubuntu-latest に入っている Chrome を使う
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # ゲームは、ブラウザの技術で作って Electron で exe にする雛形（examples/game）に切り替えてから作る。
      # 切り替えた所を一度コミットしておく（あとで「デザイン担当が src/ を作り変えたか」を、切り替えた後から見るため）
      - name: ゲームの雛形に切り替える
        if: needs.plan.outputs.stack == 'game'
        run: |
          .github/scripts/factory-game.sh .
          git add -A
          git -c user.name=factory -c user.email=factory@example.invalid commit -qm "ゲームの雛形"
      - name: 道具を入れる
        run: npm ci --no-audit --no-fund
      # AIが動かしてよいスクリプトや手順書・ルールを、AI自身が書き換えられないようにする
      - name: 手順書とスクリプトを読み取り専用にする
        run: chmod -R a-w .github .claude CLAUDE.md AGENTS.md
      # 撮影で Chrome を動かす。Ubuntu 24.04 は、Chrome の安全な囲い（sandbox）に要る仕組みを止めていることがあるので、使えるようにする
      - name: 撮影の準備
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null 2>&1 || true
          google-chrome --version || echo "::warning::Chrome が見つかりません（画面を撮れません）"
      - name: Issue に貼られた画像を取る
        env:
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-issue-images.sh || echo "::warning::Issue の画像を取れませんでした"
      - uses: anthropics/claude-code-action@v1
        id: designer
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはこのサービスのアートディレクター兼フロントエンドの作り手です。見た目を決めて、本物の画面を最後まで作ってください。
            - 種類：${{ needs.plan.outputs.stack == 'game' && 'ゲーム（TypeScript・Vite・Canvas／WebGL で作り、Electron で Windows の exe にする。進め方の「ゲームのとき」と AGENTS.md も読む）' || 'Web のサービス（Next.js）' }}
            - サービス名：${{ needs.plan.outputs.name }}
            - 説明：${{ needs.plan.outputs.desc }}
            - 元のメモ：${{ needs.plan.outputs.memo }}
            - 詳しいメモ（載せたい中身・見た目の雰囲気など。あればこれも守る）：
              ${{ needs.plan.outputs.detail }}

            `.github/factory/design-department.md`（進め方）を全部読んで、そのとおりに進めてください：
            実例を集めて撮る → 参考の板（`factory-refs/board.md`）と方向 → `src/` に作る → 撮って実例と見比べて直す（最低3回）→ 仕上げ（確認コマンド・`docs/design.md`）。
            書いてよい場所：`src/`、`public/`、`docs/design.md`、`factory-refs/`、`.shots/`、`factory-context.md`、`factory-todo.md`、`factory-pages.txt`（ゲームは `index.html` も）
            （道具を factory-add-lib.sh で入れると、package.json・package-lock.json・factory-libs.txt も変わる）。ほかは変えない。
          claude_args: '--model opus --max-turns 250 --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm run build),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run test),Bash(node .github/scripts/shot.mjs:*),Bash(.github/scripts/fetch-photos.sh:*),Bash(.github/scripts/factory-add-lib.sh:*)"'
      # 確認コマンドを、AIとは別にもう一度動かす（AIが「通った」と言っても、ここで通らなければ新しいリポジトリには入れない）
      - name: 確かめる（1 回目）
        id: check1
        if: ${{ !cancelled() }}
        run: .github/scripts/factory-checks.sh
      - uses: anthropics/claude-code-action@v1
        id: fixer
        continue-on-error: true
        if: ${{ !cancelled() && steps.check1.outputs.ok == 'false' && steps.check1.outputs.site == 'true' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはこのサービスの画面を作ったデザイン担当です。作った画面で、確認コマンド（typecheck・lint・test・build）が通りませんでした。
            `factory-checks.log`（失敗したときの出力の最後）を読んで、原因を直してください。見た目は変えない。直したら、4つのコマンドを全部動かして通ることを確かめる。
            書いてよい場所：`src/`、`public/`、`docs/design.md`（道具は `.github/scripts/factory-add-lib.sh` で入れる）。ほかは変えない。
          claude_args: '--model opus --max-turns 80 --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm run build),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run test),Bash(.github/scripts/factory-add-lib.sh:*)"'
      - name: 確かめる（2 回目）
        id: check2
        if: ${{ !cancelled() && steps.fixer.conclusion == 'success' }}
        run: .github/scripts/factory-checks.sh
      # 最後の画面を撮る：最初の1画面（390・1440・1920）と、1画面ずつスクロールした絵（390・1440）。ページは / と factory-pages.txt の物（合わせて3つまで。ゲームは /?scene=play のような場面も）
      - name: 最後の画面を撮る
        id: final
        if: ${{ !cancelled() && (steps.check1.outputs.ok == 'true' || steps.check2.outputs.ok == 'true') }}
        env:
          STACK: ${{ needs.plan.outputs.stack }}
        run: |
          out="$RUNNER_TEMP/design/ref"; mkdir -p "$out"
          pages=(/)
          if [ -f factory-pages.txt ] && [ ! -L factory-pages.txt ]; then
            while IFS= read -r p; do
              [[ "$p" =~ ^/([a-z0-9][a-z0-9/-]{0,60})?(\?[a-z0-9=\&_-]{1,40})?$ ]] && [ "$p" != / ] && [ "${#pages[@]}" -lt 3 ] && pages+=("$p")
            done < <(head -n 10 factory-pages.txt | tr -d '\r')
          fi
          if [ "$STACK" = game ]; then
            # ゲームはスクロールしないし、スマホでは遊ばない。PC の幅で、タイトルと遊んでいる場面を撮る
            node .github/scripts/shot.mjs --serve --out "$out" --widths 1440,1920 "${pages[@]}" || echo "::warning::撮れなかった場面があります"
          else
            node .github/scripts/shot.mjs --serve --out "$out" "${pages[@]}" || echo "::warning::最初の1画面を撮れなかった物があります"
            node .github/scripts/shot.mjs --serve --out "$out" --widths 390,1440 --scrolls 4 "${pages[@]}" || echo "::warning::スクロールした絵を撮れなかった物があります"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: 作った物を取っておく
        if: ${{ !cancelled() }}
        env:
          SITE_OK: ${{ steps.final.outputs.ok }}
        run: |
          d="$RUNNER_TEMP/design"; mkdir -p "$d"
          if [ -f docs/design.md ] && [ ! -L docs/design.md ]; then cp docs/design.md "$d/design.md"; fi
          for f in factory-context.md factory-libs.txt factory-todo.md; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then cp "$f" "$d/${f#factory-}"; fi
          done
          # 確認コマンドが通った物だけを、新しいリポジトリの中身として渡す（形は build ジョブの factory.sh がもう一度確かめる）
          if [ "$SITE_OK" = true ]; then
            mkdir -p "$d/site"
            cp -R src "$d/site/src"
            if [ -d public ]; then cp -R public "$d/site/public"; fi
            if [ -f index.html ] && [ ! -L index.html ]; then cp index.html "$d/site/index.html"; fi
            touch "$d/site/.checks-ok"
          fi
          touch "$d/.keep"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: factory-design
          path: ${{ runner.temp }}/design
          include-hidden-files: true
          retention-days: 3

  build:
    # 安全のため別のジョブにする：強い鍵（FACTORY_TOKEN）は、AIが動いたジョブには渡さない。スクリプトは main の物を動かす。
    # 強い鍵は Environment「factory」（main からだけ使える）に置く。AIが作ったブランチのワークフローからは読めない
    needs: [plan, design]
    # 見た目の段が飛ばされた（Python）・失敗した（雛形のまま進める）ときも作る
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    environment: factory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      # デザイン担当が入れた道具（GSAP・three.js など）を、新しいリポジトリの package.json に入れる
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        if: needs.design.result == 'success'
        continue-on-error: true
        with:
          name: factory-design
          path: ${{ runner.temp }}/design
      - name: 鍵があるか確かめる
        env:
          HAS_FACTORY: ${{ secrets.FACTORY_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "$HAS_FACTORY" != true ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="⚠️ 新しいサービスを作るには、最初の1回だけ、Environment「factory」の Secret に FACTORY_TOKEN が要ります（作り方は docs/pipeline.md の「工場」）。登録したら、このIssueを閉じて、同じ1行でもう一度作ってください。" > /dev/null
            echo "::error::FACTORY_TOKEN がありません"; exit 1
          fi
      - name: 新しいサービスを作る
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          COMMENT_TOKEN: ${{ github.token }}
          TEMPLATE: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          MEMO: ${{ needs.plan.outputs.memo }}
          MEMO_DETAIL: ${{ needs.plan.outputs.detail }}
          APP_NAME: ${{ needs.plan.outputs.name }}
          APP_STACK: ${{ needs.plan.outputs.stack }}
          APP_DESC: ${{ needs.plan.outputs.desc }}
          S_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          S_PIPELINE_APP_PRIVATE_KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          S_PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          S_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          S_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          V_PIPELINE_APP_ID: ${{ vars.PIPELINE_APP_ID }}
          V_NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
          V_AGENT_DESK_URL: ${{ vars.AGENT_DESK_URL }}
          V_VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          DESIGN_FILE: ${{ runner.temp }}/design/design.md
          CONTEXT_FILE: ${{ runner.temp }}/design/context.md
          LIBS_FILE: ${{ runner.temp }}/design/libs.txt
          DESIGN_REF_DIR: ${{ runner.temp }}/design/ref
          SITE_DIR: ${{ runner.temp }}/design/site
          TODO_FILE: ${{ runner.temp }}/design/todo.md
        run: .github/scripts/factory.sh

  # AIが名前を決められなかったときも、黙って終わらない
  report-plan-failure:
    needs: plan
    if: failure() && needs.plan.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="⚠️ 新しいサービスの名前と言語を、AIが決められませんでした（Actions の Factory の実行を見てください）。このIssueを閉じて、同じ1行でもう一度作れます。" > /dev/null
