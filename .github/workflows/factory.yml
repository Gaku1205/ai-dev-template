# 工場：ai-dev-template に「新サービス：〜」で始まるIssueを1行書くと、新しいサービスのリポジトリを作って、いつものパイプラインに渡す。
#   例：「新サービス：毎朝の天気と予定を1枚で見られるページ」
# 名前・言語（Next.js か Python）・1行の説明をAIが決め、Next.js ならデザイン担当が実例を集めてから本物の画面を作り、あとは factory.sh が行う（リポジトリ作成・秘密と変数のコピー・
# Vercel・main の保護・最初のIssue）。最初の1回だけ、Environment「factory」に FACTORY_TOKEN（と、Next.js を公開するなら VERCEL_TOKEN）の登録が要る（docs/factory.md）。
# テンプレート本体でだけ、オーナーが書いたIssueでだけ動く（公開リポジトリなので、ほかの人のIssueでは動かない）。
name: Factory

on:
  issues:
    types: [opened]
  # 工場の相談（factory-talk.yml）でオーナーが「作る」と言ったら、相談で決めた事を持って動く
  workflow_dispatch:
    inputs:
      issue:
        description: 相談した「新サービス：」の Issue の番号
        required: true

jobs:
  plan:
    # 新しい Issue は「全部おまかせ」のときだけ（ほかは factory-talk.yml が相談してから、ここを動かす）
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.is_template) ||
      (github.event.repository.is_template &&
       github.event.issue.user.login == github.repository_owner &&
       (startsWith(github.event.issue.title, '新サービス：') || startsWith(github.event.issue.title, '新サービス:')) &&
       (contains(github.event.issue.title, '全部おまかせ') || contains(github.event.issue.body, '[x] 全部おまかせ')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    outputs:
      name: ${{ steps.check.outputs.name }}
      stack: ${{ steps.check.outputs.stack }}
      desc: ${{ steps.check.outputs.desc }}
      memo: ${{ steps.check.outputs.memo }}
      detail: ${{ steps.memo.outputs.detail || steps.talk.outputs.detail }}
      body: ${{ github.event.issue.body || steps.talk.outputs.body }}
      files: ${{ steps.talk.outputs.files }}
      # デザインの案の番号（JSON の配列）。案ごとに別のジョブで同時に作り、審査で一番いい物を選ぶ（#118・#121）
      variants: ${{ steps.variants.outputs.list }}
      variant_count: ${{ steps.variants.outputs.count }}
    steps:
      # 工場のIssueの印。題が書き換えられても、テンプレート自身で企画・実装が走らないようにする（claude-plan.yml・claude-implement.yml が見る）
      - name: 工場の印を付ける
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels" -f "labels[]=factory" > /dev/null || echo "::warning::factory の印を付けられませんでした"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      # 相談してから作るとき：オーナーと決めた事（名前・種類・説明・選んだ案と見た目・答え・注文）を、相談の記録から読む（AIに決め直させない）
      - name: 相談で決めた事を読む
        id: talk
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::Issue の番号が違います"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" > "$RUNNER_TEMP/issue.json"
          owner=$(jq -r '.user.login' "$RUNNER_TEMP/issue.json")
          [ "$owner" = "$GITHUB_REPOSITORY_OWNER" ] || { echo "::error::オーナーの Issue ではありません"; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" | jq -s 'add // []' > "$RUNNER_TEMP/comments.json"
          python3 .github/scripts/factory-talk.py state "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/state.json"
          [ "$(jq -r '.stage // ""' "$RUNNER_TEMP/state.json")" = go ] || { echo "::error::相談で「作る」まで決まっていません"; exit 1; }
          python3 .github/scripts/factory-talk.py brief "$RUNNER_TEMP/state.json" > "$RUNNER_TEMP/brief.json"
          jq '{name, stack, description}' "$RUNNER_TEMP/brief.json" > factory-plan.json
          memo=$(jq -r '.memo // ""' "$RUNNER_TEMP/state.json")
          { echo 'memo<<MEMO_END'; printf '%s\n' "$memo"; echo 'MEMO_END'
            echo 'detail<<DETAIL_END'; jq -r '.detail' "$RUNNER_TEMP/brief.json" | grep -v '^DETAIL_END$'; echo 'DETAIL_END'
            echo 'body<<BODY_END'; jq -r '.body // ""' "$RUNNER_TEMP/issue.json" | tr -d '\r' | head -c 3000 | grep -v '^BODY_END$'; echo; echo 'BODY_END'
            echo "files=$(jq -c '.files' "$RUNNER_TEMP/brief.json")"; } >> "$GITHUB_OUTPUT"
      - name: メモを取り出す
        id: memo
        if: github.event_name == 'issues'
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          memo="${TITLE#新サービス：}"; memo="${memo#新サービス:}"; memo="$(printf '%s' "$memo" | sed 's/^[[:space:]]*//')"
          { echo 'memo<<MEMO_END'; printf '%s\n' "$memo"; echo 'MEMO_END'; } >> "$GITHUB_OUTPUT"
          # Issue の本文は「詳しいメモ」（載せたい中身・見た目のスタイルなど。任意、3000文字まで）
          detail="$(printf '%s' "$BODY" | tr -d '\r' | grep -v '^DETAIL_END$' | head -c 3000 | iconv -c -f utf-8 -t utf-8)"
          { echo 'detail<<DETAIL_END'; printf '%s\n' "$detail"; echo 'DETAIL_END'; } >> "$GITHUB_OUTPUT"
      # AIは名前・言語・説明を決めて、ファイルに書くだけ（ほかの操作は許さない。鍵も渡さない）
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: claude
        if: github.event_name == 'issues'
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            オーナーが、新しく作りたいサービスを1行のメモに書きました。
            メモ：${{ steps.memo.outputs.memo }}
            詳しいメモ（あれば）：
            ${{ steps.memo.outputs.detail }}

            このサービスのリポジトリを作るために、次の3つを決め、`factory-plan.json` に JSON で書いてください（ほかのファイルは作らない）。
            {"name": "...", "stack": "...", "description": "..."}
            - name：リポジトリの名前。中身が分かる短い英語を、小文字の英数字と - でつなぐ（3〜39文字、先頭は英字。例：morning-board、receipt-sorter）
            - stack：nextjs・saas・python・game・webgame のどれか
              - 人が画面で使うWebのサービス（ページ・ダッシュボード・ツール）なら nextjs
              - 会員登録・ログインがあり、月額の有料プラン（サブスク）でお金を取るWebのサービスなら saas（ログインは Supabase、課金は Stripe の土台が入る）。メモに「サブスク」「月額」「課金」「有料プラン」「会員」とあれば saas
              - 画面よりも処理が中心の物（API・データ処理・機械学習・定期的に動く処理）なら python
              - ゲーム（遊ぶ物）で、Windows の exe で配る物なら game
              - ゲームで、ブラウザ（スマホも）で URL を開いてすぐ遊べる物（Web ゲーム・ブラウザゲーム・SNS で広める物）なら webgame。exe と書いていないゲームは webgame
              - 迷ったら nextjs
            - description：何のサービスかを、日本語で1文（120文字以内。改行・バッククォートは使わない）
            メモが「何を作るか」を任せている（中身が書かれていない・「任せる」とある）ときは、ありきたりでない案を10個考えてから1つ選ぶ。
            よくある物（ToDo・家計簿・タイマー・割り勘・サブスク管理・日記・習慣トラッカー・メモ）は選ばない。saas なら、無料でも役に立ち、
            それでも月額を払う理由（有料でだけできること）がはっきりしている物を選ぶ。選んだ理由は書かなくてよい（name と description に表す）
          claude_args: '--model sonnet --max-turns 5 --allowedTools "Write"'
      - name: AIが決めた物を確かめる
        id: check
        env:
          MEMO: ${{ steps.memo.outputs.memo || steps.talk.outputs.memo }}
        run: |
          f=factory-plan.json
          if [ ! -f "$f" ] || [ -L "$f" ] || ! jq -e 'type == "object"' "$f" > /dev/null 2>&1; then
            echo "::error::AIが factory-plan.json を書きませんでした"; exit 1
          fi
          name=$(jq -r '.name // ""' "$f"); stack=$(jq -r '.stack // ""' "$f"); desc=$(jq -r '.description // ""' "$f" | tr -d '\n`')
          [[ "$name" =~ ^[a-z][a-z0-9-]{2,38}$ ]] || { echo "::error::名前「$name」の形が違います"; exit 1; }
          case "$stack" in nextjs | saas | python | game | webgame) ;; *) echo "::error::言語「$stack」は nextjs・saas・python・game・webgame のどれか"; exit 1 ;; esac
          [ -n "$desc" ] || { echo "::error::説明がありません"; exit 1; }
          desc="${desc:0:120}"
          echo "名前：$name／言語：$stack／説明：$desc"
          { echo "name=$name"; echo "stack=$stack"; echo "desc<<DESC_END"; echo "$desc"; echo "DESC_END";
            echo "memo<<MEMO_END"; printf '%s\n' "$MEMO"; echo "MEMO_END"; } >> "$GITHUB_OUTPUT"
      # デザインの案の数：いつも1案（2案にすると AI の使用量がほぼ2倍になるのに、点の差は小さかった。#193 の比べ直し）。
      # 変数 FACTORY_DESIGN_VARIANTS（1〜3）で増やせる。ゲームと、相談で見た目を決めた物は、変数があっても1案
      - name: デザインの案の数を決める
        id: variants
        env:
          STACK: ${{ steps.check.outputs.stack }}
          FILES: ${{ steps.talk.outputs.files }}
          FIXED: ${{ vars.FACTORY_DESIGN_VARIANTS }}
        run: |
          n=1
          case "$FIXED" in 1 | 2 | 3) n=$FIXED ;; esac
          case "$STACK" in game | webgame) n=1 ;; esac
          if [ -n "$FILES" ] && [ "$FILES" != "[]" ]; then n=1; fi
          list=$(python3 -c "import sys; print(list(range(int(sys.argv[1]))))" "$n")
          echo "デザインの案：${n} 案（${list}）"
          { echo "list=$list"; echo "count=$n"; } >> "$GITHUB_OUTPUT"

  # デザイン担当（Next.js とゲームのとき）：.github/factory/design-department.md。決まりは「読める・押せる・スマホで崩れない・写さない」だけ。
  # 1. Issue に貼られた画像（オーナーの「こういうのが良い」）を取ってくる
  # 2. デザイン担当（AI）が、実在の良いサイトを探して撮り、参考の板を作ってから方向を決め、本物の Next.js の画面を作って、撮って実例と見比べて直す
  # 3. 確認コマンド（typecheck・lint・test・build）を通す。通らなければ1回だけ直させる
  # 4. 最後の画面を撮る（新しいリポジトリの docs/design-ref/ に入り、あとの Issue の目標の絵になる）
  # 作った src/・public/・docs/design.md は、build ジョブ（factory.sh）が形を確かめてから新しいリポジトリに入れる。
  # AIはファイルを書くことと、決まったコマンドを動かすことだけ（鍵は持たない）
  design:
    needs: plan
    if: needs.plan.outputs.stack == 'nextjs' || needs.plan.outputs.stack == 'saas' || needs.plan.outputs.stack == 'game' || needs.plan.outputs.stack == 'webgame'
    # 方向の違う案を、案ごとに別のジョブで同時に作る（時間は1案ぶん）。1つが落ちても、ほかの案は続ける。選ぶのは design-pick
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants || '[0]') }}
    runs-on: ubuntu-latest
    # 作る（最大 250 手）＋ 審査 ＋ 直し（最大 100 手）＋ もう一度審査、まで入る長さ
    timeout-minutes: 210
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      # 撮影（shot.mjs）は Node 22 以上が要る。撮影は ubuntu-latest に入っている Chrome を使う
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # ゲームは、ブラウザの技術で作って Electron で exe にする雛形（examples/game）に切り替えてから作る。
      # 切り替えた所を一度コミットしておく（あとで「デザイン担当が src/ を作り変えたか」を、切り替えた後から見るため）
      - name: ゲームの雛形に切り替える
        if: needs.plan.outputs.stack == 'game' || needs.plan.outputs.stack == 'webgame'
        env:
          MODE: ${{ needs.plan.outputs.stack == 'webgame' && 'web' || 'exe' }}
        run: |
          .github/scripts/factory-game.sh . "$MODE"
          git add -A
          git -c user.name=factory -c user.email=factory@example.invalid commit -qm "ゲームの雛形"
      # 会員と月額課金：ログイン（Supabase）と有料プラン（Stripe）の土台を入れてから作る（デザイン担当が、ログイン・料金・アカウントの画面も作るため）
      - name: 会員と課金の土台を入れる
        if: needs.plan.outputs.stack == 'saas'
        run: |
          .github/scripts/factory-saas.sh . install
          git add -A
          git -c user.name=factory -c user.email=factory@example.invalid commit -qm "会員と課金の土台"
      - name: 道具を入れる
        run: npm ci --no-audit --no-fund
      # AIが動かしてよいスクリプトや手順書・ルールを、AI自身が書き換えられないようにする
      - name: 手順書とスクリプトを読み取り専用にする
        run: chmod -R a-w .github .claude CLAUDE.md AGENTS.md
      # 日本語のフォントの .deb をキャッシュから戻す（Ubuntu のミラーに行かずに入れる。#255 の2つ目）。戻すのも残すのもAIが動く前
      - name: 日本語のフォントのキャッシュを戻す
        id: ja-fonts-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ja-fonts-apt
          key: ja-fonts-apt-${{ runner.os }}-v1
      # 撮影で Chrome を動かす。Ubuntu 24.04 は、Chrome の安全な囲い（sandbox）に要る仕組みを止めていることがあるので、使えるようにする
      - name: 撮影の準備
        id: shot-prep
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null 2>&1 || true
          google-chrome --version || echo "::warning::Chrome が見つかりません（画面を撮れません）"
          JA_FONTS_CACHE="$HOME/.cache/ja-fonts-apt" .github/scripts/install-ja-fonts.sh
      - name: 日本語のフォントのキャッシュを残す
        if: steps.shot-prep.outputs.ja_fonts_deb == 'true' && steps.ja-fonts-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ja-fonts-apt
          key: ja-fonts-apt-${{ runner.os }}-v1
      - name: Issue に貼られた画像を取る
        env:
          BODY: ${{ needs.plan.outputs.body }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-issue-images.sh || echo "::warning::Issue の画像を取れませんでした"
      # 相談でオーナーが選んだざっくり画面（HTML と画像）と見た目の方向の板を、いちばん大事な実例として置く
      - name: 相談で選んだ画面を取る
        if: needs.plan.outputs.files != '' && needs.plan.outputs.files != '[]'
        env:
          FILES: ${{ needs.plan.outputs.files }}
        run: |
          mkdir -p factory-refs/issue
          git fetch -q --depth 1 origin factory-talk || { echo "::warning::factory-talk ブランチを取れませんでした"; exit 0; }
          jq -r '.[]' <<< "$FILES" | while IFS= read -r f; do
            [[ "$f" =~ ^issue-[0-9]+/r[0-9]+-(looks|mocks)/(look-[1-3](-1440|-390)?\.(png|html)|mock-[ab](-1440|-390)?\.(png|html)|concept\.md|credits\.json)$ ]] || continue
            # 見た目の方向の最初の1画面（ざっくり画面を通らないとき、これが本番の土台）は chosen-look.html・chosen-look.png・chosen-look-390.png に
            dest=$(basename "$f" | sed -E 's/^mock-[ab]/chosen-mock/; s/^look-[1-3]-1440\.png$/chosen-look.png/; s/^look-[1-3]-390\.png$/chosen-look-390.png/; s/^look-[1-3]\.html$/chosen-look.html/; s/^concept\.md$/chosen-concept.md/; s/^credits\.json$/chosen-credits.json/')
            # 設計メモと絵の出どころは、無いこともある（古い相談）。無ければ飛ばす
            if git show "FETCH_HEAD:$f" > "factory-refs/issue/$dest" 2> /dev/null; then
              echo "- $dest：オーナーが工場の相談で選んだ物（$f）" >> factory-refs/issue/INDEX.md
            else
              rm -f "factory-refs/issue/$dest"
            fi
          done
          ls factory-refs/issue
      # 起こしたボット（パイプラインの App や、工場の相談の github-actions）を、AIのアクションが断らないようにする。
      # AI自身（claude[bot]）は許さない。Secret は使わない
      - name: 起こしたボットを許可に入れる
        id: bots
        env:
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          list=""
          if [ "$SENDER_TYPE" = Bot ] && [ "$SENDER" != "claude[bot]" ]; then
            list="${SENDER},${SENDER%\[bot\]}"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: designer
        continue-on-error: true
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはこのサービスのアートディレクター兼フロントエンドの作り手です。見た目を決めて、本物の画面を最後まで作ってください。
            - 種類：${{ needs.plan.outputs.stack == 'game' && 'ゲーム（TypeScript・Vite・Canvas／WebGL で作り、Electron で Windows の exe にする。進め方の「ゲームのとき」と AGENTS.md も読む）' || (needs.plan.outputs.stack == 'webgame' && 'Web のゲーム（TypeScript・Vite・Canvas／WebGL で作り、Vercel で公開してスマホでも PC でもブラウザで遊ぶ。進め方の「ゲームのとき」と AGENTS.md も読む）' || (needs.plan.outputs.stack == 'saas' && '会員登録と月額の有料プランがある Web のサービス（Next.js。ログインは Supabase、課金は Stripe の土台がもう入っている。最初に docs/billing.md を読む。無料でできること・有料でできることを決めて docs/design.md に書く。道具のサービスは、トップを宣伝のページにせず、開いた最初の画面に道具そのものを出し、有料の機能は道具の中の鍵つきの欄として見せる（進め方の「AIっぽさの型」を使わない）。料金の画面（/pricing）も作る。ログイン（src/app/login/page.tsx・LoginForm.tsx）とアカウント（src/app/account/page.tsx）の画面は、決めた見た目で作り直してよいが、フォームの送り先と入力の name は変えない。docs/billing.md の「中身を変えない」ファイルは変えない。月額の値段（円。100〜3000）を factory-price.txt に数字だけ1行で書く。鍵が無いので、ログインした後の画面は撮れない。ログインしていない時の見た目と、料金の画面で見せる）' || 'Web のサービス（Next.js）')) }}
            - サービス名：${{ needs.plan.outputs.name }}
            - 説明：${{ needs.plan.outputs.desc }}
            - 元のメモ：${{ needs.plan.outputs.memo }}
            - 詳しいメモ（載せたい中身・見た目の雰囲気など。あればこれも守る）：
              ${{ needs.plan.outputs.detail }}

            ${{ fromJSON(needs.plan.outputs.variants || '[0]')[1] != null && format('この工場は、方向の違う画面案を同時に{0}つ作り、審査で一番いい物を使います。あなたは案{1}（番号 {2}）の担当です。`.github/factory/design-department.md` の「案ごとに違う方向を担当する」に従い、番号に応じた考えを主役にしてください。ほかの案は見ません。', needs.plan.outputs.variant_count, fromJSON('[1, 2, 3]')[matrix.variant], matrix.variant) || '' }}

            ${{ needs.plan.outputs.files != '' && needs.plan.outputs.files != '[]' && 'オーナーと相談して、見た目がもう決まっています（factory-refs/issue/INDEX.md に一覧）。ざっくり画面（chosen-mock.html・chosen-mock-1440.png・chosen-mock-390.png）があれば、その構図・色・文字を土台にする。無ければ（ふだん）、選んだ方向の本物の最初の1画面（chosen-look.html・chosen-look.png・chosen-look-390.png）の構図・色・文字を土台にし、下の欄とほかの画面は、設計メモ（chosen-concept.md）の通し表を書き足して、同じ考えで自分で作る。方向を決め直さず、本物の画面に仕上げてください（実例集めは、足りない部品の参考にする分だけでよい）。詳しいメモの「オーナーの注文」も守る。「（中身の決まり）」と付いた答えは、画面の動き・データの持ち方で守る（画面の中に説明の欄を足して見せない）。' || '' }}
            `.github/factory/design-department.md`（進め方）を全部読んで、そのとおりに進めてください：
            （ゲームは最初に、ありきたりにしないための遊び方のアイデア）→ 実例を集めて撮る → 参考の板（`factory-refs/board.md`）と方向 → `src/` に作る → 撮って実例と見比べて直す（最低3回）→ 仕上げ（確認コマンド・`docs/design.md`）。
            書いてよい場所：`src/`、`public/`、`docs/design.md`、`factory-refs/`、`.shots/`、`factory-context.md`、`factory-todo.md`、`factory-pages.txt`（ゲームは `index.html` も。会員と課金のサービスは `factory-price.txt` も）
            （道具を factory-add-lib.sh で入れると、package.json・package-lock.json・factory-libs.txt も変わる）。ほかは変えない。
          claude_args: '--model opus --max-turns 250 --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm run build),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run test),Bash(node .github/scripts/shot.mjs:*),Bash(.github/scripts/fetch-photos.sh:*),Bash(.github/scripts/factory-add-lib.sh:*),Bash(node .claude/skills/taste-skill/scripts/draw.mjs:*),Bash(node .claude/skills/taste-skill/scripts/lint.mjs:*),Bash(node .claude/skills/taste-skill/scripts/inspect.mjs:*),Bash(node .claude/skills/taste-skill/scripts/assets.mjs:*)"'
      # 確認コマンドを、AIとは別にもう一度動かす（AIが「通った」と言っても、ここで通らなければ新しいリポジトリには入れない）
      - name: 確かめる（1 回目）
        id: check1
        if: ${{ !cancelled() }}
        run: .github/scripts/factory-checks.sh
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: fixer
        continue-on-error: true
        if: ${{ !cancelled() && steps.check1.outputs.ok == 'false' && steps.check1.outputs.site == 'true' }}
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはこのサービスの画面を作ったデザイン担当です。作った画面で、確認コマンド（typecheck・lint・test・build）が通りませんでした。
            `factory-checks.log`（失敗したときの出力の最後）を読んで、原因を直してください。見た目は変えない。直したら、4つのコマンドを全部動かして通ることを確かめる。
            書いてよい場所：`src/`、`public/`、`docs/design.md`（道具は `.github/scripts/factory-add-lib.sh` で入れる）。ほかは変えない。
          claude_args: '--model opus --max-turns 80 --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm run build),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run test),Bash(.github/scripts/factory-add-lib.sh:*),Bash(node .claude/skills/taste-skill/scripts/draw.mjs:*),Bash(node .claude/skills/taste-skill/scripts/lint.mjs:*),Bash(node .claude/skills/taste-skill/scripts/inspect.mjs:*),Bash(node .claude/skills/taste-skill/scripts/assets.mjs:*)"'
      - name: 確かめる（2 回目）
        id: check2
        if: ${{ !cancelled() && steps.fixer.conclusion == 'success' }}
        run: .github/scripts/factory-checks.sh
      # ---- 関門と審査（docs/pipeline.md「デザインの仕組み」。ゲームは対象外） ----
      # 作ったAIは自分の画面を甘く見るので、確認コマンドが通った画面を、別のAI（審査役）が画像だけで審査する。機械で測れる事（設計メモ・本物の絵の枚数・lint）は関門が測る。
      # 合格かどうかはスクリプトが決める。届かなければ、指摘の紙（.judge/fix.md）で1回だけ直させ、確認コマンドをもう一度通してから、もう一度審査する。
      # 直して確認コマンドが通らなくなったら、直す前の物に戻す（壊れた画面を新しいリポジトリに入れない）
      - name: 関門と審査の準備（1 回目）
        id: review1
        if: ${{ !cancelled() && (steps.check1.outputs.ok == 'true' || steps.check2.outputs.ok == 'true') && needs.plan.outputs.stack != 'game' && needs.plan.outputs.stack != 'webgame' }}
        env:
          BRIEF_TEXT: |
            サービス名：${{ needs.plan.outputs.name }}
            説明：${{ needs.plan.outputs.desc }}
            元のメモ：${{ needs.plan.outputs.memo }}
            詳しいメモ（オーナーと相談して決めた事・注文があれば、ここに入っている）：
            ${{ needs.plan.outputs.detail }}
        run: .github/scripts/design-review.sh prepare site
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: judge1
        if: ${{ !cancelled() && steps.review1.outputs.ok == 'true' }}
        continue-on-error: true
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは審査役です（作ったAIとは別のAI）。`.github/factory/judge.md` を全部読み、そのとおりに、画像だけを見て審査してください。
            - 種類：screen（この種類の問いに全部答える）
            - 審査する物（`items` の `name`）：site（作られたサービスの画面の全部。`.judge/made/` の画像。`top-…` が最初のページ、`-s2`・`-s3` は下へスクロールした続き、ほかの名前はほかのページ）
            - 比べる実在のサイトは `.judge/refs/`、何のサービスか・オーナーが決めた事は `.judge/brief.md`
            - 書くのは `.judge/verdict.json` だけ。コード・HTML は開かない
          claude_args: '--model opus --max-turns 40 --allowedTools "Read,Glob,Write"'
      - name: 審査の結果（1 回目）
        id: verdict1
        if: ${{ !cancelled() && steps.review1.outputs.ok == 'true' }}
        run: .github/scripts/design-review.sh verdict screen 1
      - name: 直す前の物を取っておく
        id: snapshot
        if: ${{ !cancelled() && steps.verdict1.outputs.pass == 'false' }}
        run: |
          b="$RUNNER_TEMP/before-judge-fix"; rm -rf "$b"; mkdir -p "$b"
          cp -R src "$b/src"
          if [ -d public ]; then cp -R public "$b/public"; fi
          if [ -f docs/design.md ] && [ ! -L docs/design.md ]; then cp docs/design.md "$b/design.md"; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: jfix
        if: ${{ !cancelled() && steps.snapshot.outputs.ok == 'true' }}
        continue-on-error: true
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはこのサービスの画面を作ったデザイン担当です。作った画面を、別のAI（審査役）と関門が審査し、合格に届きませんでした。
            1. `.judge/fix.md`（直すこと）と `.judge/made/`（審査に使った画像）を Read で見る。`.github/factory/concept.md` の「3. 何で埋めるか」「5. 通し表」と、`factory-refs/concept.md`（自分の設計メモ）を読み直す
            2. 関門の指摘は全部直す。審査役の「必ず通す」の「いいえ」を先に、次に「直し」を上から。消すだけにしない（消した所は、大きい文字・色の面・本物の絵・中身で埋める）。指摘の無い所は変えない
            3. 直したら、確認コマンド（typecheck・lint・test・build）を全部通し、`node .github/scripts/shot.mjs --serve --out .shots --scrolls 4 /` で撮り直して、画像を全部 Read で見る
            4. 見た目の決まりが変わったら `docs/design.md` も直す
            書いてよい場所：`src/`、`public/`、`docs/design.md`、`factory-refs/`、`.shots/`（道具は `.github/scripts/factory-add-lib.sh` で入れる）。ほかは変えない。
          claude_args: '--model opus --max-turns 100 --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm run build),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run test),Bash(node .github/scripts/shot.mjs:*),Bash(.github/scripts/fetch-photos.sh:*),Bash(.github/scripts/factory-add-lib.sh:*),Bash(node .claude/skills/taste-skill/scripts/draw.mjs:*),Bash(node .claude/skills/taste-skill/scripts/lint.mjs:*),Bash(node .claude/skills/taste-skill/scripts/inspect.mjs:*),Bash(node .claude/skills/taste-skill/scripts/assets.mjs:*)"'
      - name: 確かめる（審査の直しの後）
        id: check3
        if: ${{ !cancelled() && steps.jfix.outcome != 'skipped' && steps.snapshot.outputs.ok == 'true' }}
        run: .github/scripts/factory-checks.sh
      - name: 通らなければ、直す前の物に戻す
        if: ${{ !cancelled() && steps.snapshot.outputs.ok == 'true' && steps.check3.outputs.ok != 'true' }}
        run: |
          b="$RUNNER_TEMP/before-judge-fix"
          rm -rf src && cp -R "$b/src" src
          if [ -d "$b/public" ]; then rm -rf public && cp -R "$b/public" public; fi
          if [ -f "$b/design.md" ]; then cp "$b/design.md" docs/design.md; fi
          npm run build > /dev/null 2>&1 || echo "::warning::戻した物をビルドできませんでした"
          echo "::warning::審査の直しで確認コマンドが通らなくなったので、直す前の物に戻しました"
      - name: 関門と審査の準備（2 回目）
        id: review2
        if: ${{ !cancelled() && steps.check3.outputs.ok == 'true' }}
        env:
          BRIEF_TEXT: |
            サービス名：${{ needs.plan.outputs.name }}
            説明：${{ needs.plan.outputs.desc }}
            元のメモ：${{ needs.plan.outputs.memo }}
            詳しいメモ（オーナーと相談して決めた事・注文があれば、ここに入っている）：
            ${{ needs.plan.outputs.detail }}
        run: .github/scripts/design-review.sh prepare site
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: judge2
        if: ${{ !cancelled() && steps.review2.outputs.ok == 'true' }}
        continue-on-error: true
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは審査役です（作ったAIとは別のAI）。`.github/factory/judge.md` を全部読み、そのとおりに、画像だけを見て審査してください。
            - 種類：screen（この種類の問いに全部答える）
            - 審査する物（`items` の `name`）：site（作られたサービスの画面の全部。`.judge/made/` の画像。`top-…` が最初のページ、`-s2`・`-s3` は下へスクロールした続き、ほかの名前はほかのページ）
            - 比べる実在のサイトは `.judge/refs/`、何のサービスか・オーナーが決めた事は `.judge/brief.md`
            - 書くのは `.judge/verdict.json` だけ。コード・HTML は開かない
          claude_args: '--model opus --max-turns 40 --allowedTools "Read,Glob,Write"'
      - name: 審査の結果（2 回目）
        id: verdict2
        if: ${{ !cancelled() && steps.review2.outputs.ok == 'true' }}
        run: .github/scripts/design-review.sh verdict screen 2
      # 直した後の点が直す前より下がったら、直す前の物に戻す（#88：7.3 点 → 直した後 6.7 点で、崩れが増えた物が残った）
      - name: 直した後の方が悪ければ、直す前の物に戻す
        if: ${{ !cancelled() && steps.snapshot.outputs.ok == 'true' && steps.verdict1.outputs.score != '' && steps.verdict2.outputs.score != '' }}
        env:
          S1: ${{ steps.verdict1.outputs.score }}
          S2: ${{ steps.verdict2.outputs.score }}
        run: |
          if awk -v a="$S1" -v b="$S2" 'BEGIN { exit !(b + 0 < a + 0) }'; then
            b="$RUNNER_TEMP/before-judge-fix"
            rm -rf src && cp -R "$b/src" src
            if [ -d "$b/public" ]; then rm -rf public && cp -R "$b/public" public; fi
            if [ -f "$b/design.md" ]; then cp "$b/design.md" docs/design.md; fi
            if npm run build > /dev/null 2>&1; then
              echo "::warning::直した後の点（${S2}）が直す前（${S1}）より低いので、直す前の物に戻しました"
              echo "- 直した後の点（${S2}）が直す前（${S1}）より低かったので、直す前の物を使いました" >> "$RUNNER_TEMP/judge-revert.md"
            else
              echo "::warning::直す前の物に戻すとビルドできないので、直した後の物のままにします"
            fi
          else
            echo "直した後の点（${S2}）は直す前（${S1}）以上なので、そのまま使います"
          fi
      - name: 審査の結果をまとめる
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/design"
          .github/scripts/design-review.sh summary "$RUNNER_TEMP/design/judge.md" || true
          if [ -f "$RUNNER_TEMP/judge-revert.md" ] && [ -f "$RUNNER_TEMP/design/judge.md" ]; then cat "$RUNNER_TEMP/judge-revert.md" >> "$RUNNER_TEMP/design/judge.md"; fi
          if [ -f "$RUNNER_TEMP/design/judge.md" ]; then cat "$RUNNER_TEMP/design/judge.md"; fi
          # この案の最後の審査の結果（直した後に戻したら1回目、直した後を使ったら2回目）。design-pick が案を選ぶのに使う
          final=.judge-results/r1.json
          if [ -f .judge-results/r2.json ] && [ ! -f "$RUNNER_TEMP/judge-revert.md" ]; then final=.judge-results/r2.json; fi
          if [ -f "$final" ] && [ ! -L "$final" ]; then cp "$final" "$RUNNER_TEMP/design/result.json"; fi
      # 最後の画面を撮る：最初の1画面（390・1440・1920）と、1画面ずつスクロールした絵（390・1440）。ページは / と factory-pages.txt の物（合わせて3つまで。ゲームは /?scene=play のような場面も）
      - name: 最後の画面を撮る
        id: final
        if: ${{ !cancelled() && (steps.check1.outputs.ok == 'true' || steps.check2.outputs.ok == 'true') }}
        env:
          STACK: ${{ needs.plan.outputs.stack }}
        run: |
          out="$RUNNER_TEMP/design/ref"; mkdir -p "$out"
          pages=(/)
          if [ -f factory-pages.txt ] && [ ! -L factory-pages.txt ]; then
            while IFS= read -r p; do
              [[ "$p" =~ ^/([a-z0-9][a-z0-9/-]{0,60})?(\?[a-z0-9=\&_-]{1,40})?$ ]] && [ "$p" != / ] && [ "${#pages[@]}" -lt 3 ] && pages+=("$p")
            done < <(head -n 10 factory-pages.txt | tr -d '\r')
          fi
          if [ "$STACK" = game ]; then
            # ゲームはスクロールしないし、スマホでは遊ばない。PC の幅で、タイトルと遊んでいる場面を撮る
            node .github/scripts/shot.mjs --serve --out "$out" --widths 1440,1920 "${pages[@]}" || echo "::warning::撮れなかった場面があります"
          elif [ "$STACK" = webgame ]; then
            # Web のゲームはスクロールしない。スマホと PC の幅で、タイトルと遊んでいる場面を撮る
            node .github/scripts/shot.mjs --serve --out "$out" --widths 390,1440 "${pages[@]}" || echo "::warning::撮れなかった場面があります"
          else
            node .github/scripts/shot.mjs --serve --out "$out" "${pages[@]}" || echo "::warning::最初の1画面を撮れなかった物があります"
            node .github/scripts/shot.mjs --serve --out "$out" --widths 390,1440 --scrolls 4 "${pages[@]}" || echo "::warning::スクロールした絵を撮れなかった物があります"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: 作った物を取っておく
        if: ${{ !cancelled() }}
        env:
          SITE_OK: ${{ steps.final.outputs.ok }}
        run: |
          d="$RUNNER_TEMP/design"; mkdir -p "$d"
          if [ -f docs/design.md ] && [ ! -L docs/design.md ]; then cp docs/design.md "$d/design.md"; fi
          for f in factory-context.md factory-libs.txt factory-todo.md factory-price.txt; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then cp "$f" "$d/${f#factory-}"; fi
          done
          # ゲームの遊び方のアイデア（board.md の「## アイデア」の節）。結果のコメントに載せる
          if [ -f factory-refs/board.md ] && [ ! -L factory-refs/board.md ]; then
            python3 - factory-refs/board.md "$d/idea.md" <<'PY' || true
          import re, sys
          s = open(sys.argv[1], encoding="utf-8", errors="ignore").read()
          m = re.search(r"^## アイデア[^\n]*\n(.*?)(?=^## |\Z)", s, re.S | re.M)
          if m and m.group(1).strip():
              open(sys.argv[2], "w", encoding="utf-8").write(m.group(1).strip()[:3000] + "\n")
          PY
          fi
          # 確認コマンドが通った物だけを、新しいリポジトリの中身として渡す（形は build ジョブの factory.sh がもう一度確かめる）
          if [ "$SITE_OK" = true ]; then
            mkdir -p "$d/site"
            cp -R src "$d/site/src"
            if [ -d public ]; then cp -R public "$d/site/public"; fi
            if [ -f index.html ] && [ ! -L index.html ]; then cp index.html "$d/site/index.html"; fi
            touch "$d/site/.checks-ok"
          fi
          touch "$d/.keep"
      # 審査の記録（審査役の答え・指摘の紙・関門・渡した紙）を残す。あとから「なぜ落ちたか」を調べるため
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: factory-judge-record-${{ matrix.variant }}
          path: |
            .judge/verdict.json
            .judge/fix.md
            .judge/gate.json
            .judge/brief.md
            .judge/lint.json
            .judge-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: factory-design-${{ matrix.variant }}
          path: ${{ runner.temp }}/design
          include-hidden-files: true
          retention-days: 3

  # 案を選ぶ：全部の案の審査の結果から、合格した中の最高点（合格が無ければ最高点）を使う（design-judge.py pick）。
  # 審査できた案が無ければ、確認コマンドが通った最初の案を使う。選んだ案を factory-design として build に渡す。
  # 結果のコメント（judge.md）には、全部の案の点と、どれを選んだかを書く
  design-pick:
    needs: [plan, design]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.design.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: factory-design-*
          path: ${{ runner.temp }}/variants
      - name: 使う案を選ぶ
        id: pick
        env:
          VARIANTS: ${{ needs.plan.outputs.variants || '[0]' }}
        run: |
          v="$RUNNER_TEMP/variants"
          mapfile -t nums < <(printf '%s' "$VARIANTS" | jq -r '.[]')
          results=()
          for n in "${nums[@]}"; do results+=("$v/factory-design-$n/result.json"); done
          idx=$(python3 .github/scripts/design-judge.py pick "${results[@]}" | sed -n 's/^index=//p')
          if [ -z "$idx" ]; then
            # 審査できた案が無い：確認コマンドが通った最初の案（無ければ最初の案）
            idx=0
            for i in "${!nums[@]}"; do
              if [ -f "$v/factory-design-${nums[$i]}/site/.checks-ok" ]; then idx=$i; break; fi
            done
          fi
          chosen="$v/factory-design-${nums[$idx]}"
          echo "使う案：案$((idx + 1))（${#nums[@]} 案のうち）"
          mkdir -p "$RUNNER_TEMP/design"
          if [ -d "$chosen" ]; then cp -R "$chosen/." "$RUNNER_TEMP/design/"; fi
          # 案が2つ以上なら、結果のコメントに全部の案の点を載せる
          if [ "${#nums[@]}" -gt 1 ]; then
            {
              python3 .github/scripts/design-judge.py summary --picked "$idx" "${results[@]}" 2> /dev/null || true
              if [ -f "$chosen/judge.md" ]; then echo; echo "選んだ案の審査："; cat "$chosen/judge.md"; fi
            } > "$RUNNER_TEMP/design/judge.md"
            cat "$RUNNER_TEMP/design/judge.md"
          fi
          touch "$RUNNER_TEMP/design/.keep"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: factory-design
          path: ${{ runner.temp }}/design
          include-hidden-files: true
          retention-days: 3

  build:
    # 安全のため別のジョブにする：強い鍵（FACTORY_TOKEN）は、AIが動いたジョブには渡さない。スクリプトは main の物を動かす。
    # 強い鍵は Environment「factory」（main からだけ使える）に置く。AIが作ったブランチのワークフローからは読めない
    needs: [plan, design-pick]
    # 見た目の段が飛ばされた（Python）・失敗した（雛形のまま進める）ときも作る
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    environment: factory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # デザイン担当が入れた道具（GSAP・three.js など）を、新しいリポジトリの package.json に入れる
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.design-pick.result == 'success'
        continue-on-error: true
        with:
          name: factory-design
          path: ${{ runner.temp }}/design
      - name: 鍵があるか確かめる
        env:
          HAS_FACTORY: ${{ secrets.FACTORY_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          if [ "$HAS_FACTORY" != true ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="⚠️ 新しいサービスを作るには、最初の1回だけ、Environment「factory」の Secret に FACTORY_TOKEN が要ります（作り方は docs/factory.md）。登録したら、このIssueを閉じて、同じ1行でもう一度作ってください。" > /dev/null
            echo "::error::FACTORY_TOKEN がありません"; exit 1
          fi
      - name: 新しいサービスを作る
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          COMMENT_TOKEN: ${{ github.token }}
          TEMPLATE: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          MEMO: ${{ needs.plan.outputs.memo }}
          MEMO_DETAIL: ${{ needs.plan.outputs.detail }}
          APP_NAME: ${{ needs.plan.outputs.name }}
          APP_STACK: ${{ needs.plan.outputs.stack }}
          APP_DESC: ${{ needs.plan.outputs.desc }}
          S_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          S_PIPELINE_APP_PRIVATE_KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          S_PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          S_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          S_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # 会員と課金（saas）のときだけ使う：新しい Supabase のプロジェクトを作る鍵と、Stripe のテストモードの鍵
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRICE_FILE: ${{ runner.temp }}/design/price.txt
          V_PIPELINE_APP_ID: ${{ vars.PIPELINE_APP_ID }}
          V_NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
          V_AGENT_DESK_URL: ${{ vars.AGENT_DESK_URL }}
          V_VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          DESIGN_FILE: ${{ runner.temp }}/design/design.md
          CONTEXT_FILE: ${{ runner.temp }}/design/context.md
          LIBS_FILE: ${{ runner.temp }}/design/libs.txt
          DESIGN_REF_DIR: ${{ runner.temp }}/design/ref
          JUDGE_FILE: ${{ runner.temp }}/design/judge.md
          SITE_DIR: ${{ runner.temp }}/design/site
          TODO_FILE: ${{ runner.temp }}/design/todo.md
          IDEA_FILE: ${{ runner.temp }}/design/idea.md
        run: .github/scripts/factory.sh

  # AIが名前を決められなかったときも、黙って終わらない
  report-plan-failure:
    needs: plan
    if: failure() && needs.plan.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="⚠️ 新しいサービスの名前と言語を、AIが決められませんでした（Actions の Factory の実行を見てください）。このIssueを閉じて、同じ1行でもう一度作れます。" > /dev/null
