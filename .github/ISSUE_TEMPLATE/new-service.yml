name: 新サービス（1行で作る）
description: ai-dev-template 本体だけ。作りたいサービスを1行で書くと、工場が新しいリポジトリを作って、公開まで自動で進める
title: "新サービス："
body:
  - type: markdown
    attributes:
      value: |
        **タイトルの「新サービス：」のあとに、作りたいサービスを1行で書いて Submit するだけ。** 下は空でよい。
        工場（`factory.yml`）が名前・言語を決め、デザイン担当が実在の良いサイトを参考に本物の画面を作って、新しいリポジトリにして公開まで進めます。結果はこのIssueにコメントされます。
  - type: textarea
    id: note
    attributes:
      label: 詳しいメモ・参考の画像（任意）
      description: 載せたい中身や雰囲気。リールのスクショや好きなサイトの画面を貼ると（10 枚まで）、デザイン担当がいちばん大事な参考として見る。URL を書けばそれも見る
    validations:
      required: false
