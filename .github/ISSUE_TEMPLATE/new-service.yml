name: 新サービス（1行で作る）
description: ai-dev-template 本体だけ。作りたいサービスを1行で書くと、工場が新しいリポジトリを作って、公開まで自動で進める
title: "新サービス："
body:
  - type: markdown
    attributes:
      value: |
        **タイトルの「新サービス：」のあとに、作りたいサービスを1行で書いて Submit するだけ。** 下は空でよい。
        工場がいきなり作らず、**案を5つと質問** → **見た目の方向を3つ** → **ざっくり画面を2案** → **最終確認** の順にコメントで聞きます（返事はコメントで。答えるまで待ちます）。「作る」と返事したら、新しいリポジトリにして公開まで進めます。
        相談せずに全部任せるなら、下の「全部おまかせ」にチェックを入れてください（今までどおり、工場が全部決めて作ります）。
  - type: textarea
    id: note
    attributes:
      label: 詳しいメモ・参考の画像（任意）
      description: 載せたい中身や雰囲気。リールのスクショや好きなサイトの画面を貼ると（10 枚まで）、デザイン担当がいちばん大事な参考として見る。URL を書けばそれも見る
    validations:
      required: false
  - type: checkboxes
    id: auto
    attributes:
      label: 進め方
      options:
        - label: 全部おまかせ（案や見た目を選ばずに、工場が全部決めて最後まで作る）
          required: false
